name: Pages (MkDocs)

on:
  push:
    branches: [ main ]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
  release:
    types: [published]
  workflow_dispatch:

# Only the deploy job publishes, so only it may write to Pages and ask for
# an OIDC token.
permissions:
  contents: read

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      # Every package by version and hash; the hashes are for Python 3.12.
      - name: Install dependencies
        run: |
          pip install --require-hashes --only-binary :all: -r .github/requirements/docs.txt
      - name: Build with MkDocs
        run: mkdocs build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4


