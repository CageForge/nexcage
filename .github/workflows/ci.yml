name: CI

# The required check for the default build: Proxmox LXC only, on a
# GitHub-hosted runner. Replaces ci_cncf.yml and build_vendored.yml, which
# installed a package Ubuntu no longer ships (libcriu-dev), called build steps
# that do not exist (prepare-crun, -Duse-vendored-libcrun) and queued jobs for a
# runner label ("runner0") that no runner has.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build and test (Proxmox LXC)
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.15.1

      - name: Formatting
        # `make lint`, and the reason main had 21 unformatted files for a
        # while: nothing checked.
        run: zig fmt --check src/ tests/

      - name: build.zig's include paths exist
        # build.zig named ./crun-1.23.1 for a release after vendored crun had
        # moved to deps/crun, and a stray directory of that name would have
        # been searched. A path inside a submodule counts: this checkout does
        # not fetch submodules.
        run: |
          set -eu
          subs=$(git config -f .gitmodules --get-regexp '\.path$' | awk '{print $2}')
          paths=$(sed -n 's/.*\.cwd_relative = "\([^"]*\)".*/\1/p' build.zig | sort -u)
          [ -n "$paths" ] || { echo "::error::no include paths read from build.zig"; exit 1; }
          bad=0
          for p in $paths; do
            case $p in /*) continue ;; esac
            p=${p#./}
            [ -e "$p" ] && continue
            in_sub=no
            for s in $subs; do case "$p/" in "$s"/*) in_sub=yes ;; esac; done
            [ "$in_sub" = yes ] && continue
            echo "::error::build.zig names the include path $p, which does not exist"; bad=1
          done
          exit "$bad"

      - name: The Dockerfile builds the crun deps/crun pins
        # Releases are built through the Dockerfile, which clones crun by a
        # hash of its own; dependency_check.yml reports the submodule's.
        run: sh scripts/ci/check_crun_pin.sh

      - name: Build (Debug)
        run: zig build --summary all

      - name: Build (ReleaseSafe)
        run: zig build -Doptimize=ReleaseSafe -p zig-out-release

      - name: The release build is position-independent
        # nexcage runs as root and, with the crun backend, parses bundles in
        # libcrun's C code. Only a PIE is loaded at a random address; Zig's
        # default for an executable is not one.
        run: |
          type=$(readelf -h zig-out-release/bin/nexcage | sed -n 's/^ *Type: *//p')
          echo "ELF type: ${type:-unreadable}"
          case "$type" in
            DYN*) ;;
            *) echo "::error::zig-out-release/bin/nexcage is not position-independent"; exit 1 ;;
          esac

      - name: Unit tests
        run: zig build test --summary all

      - name: Smoke tests
        # Actions runs this with bash -e, so a command expected to fail must
        # be written "cmd || rc=$?"; "cmd; rc=$?" ends the step at cmd.
        run: |
          set -uo pipefail
          nx=./zig-out/bin/nexcage
          fail() { echo "::error::$*"; exit 1; }

          $nx --help >/dev/null || fail "--help failed"
          $nx version || fail "version failed"
          $nx create --help >/dev/null || fail "create --help failed"

          # An id nexcage holds no record of reaches no backend: it is not
          # taken for a Proxmox container nexcage did not create. Exit 1,
          # saying so.
          rc=0; $nx start ci-smoke 2> err.txt || rc=$?
          cat err.txt
          [ "$rc" -eq 1 ] || fail "start of an unknown id: expected exit 1, got $rc"
          grep -q "ERROR nexcage: container 'ci-smoke' does not exist: " err.txt || fail "start of an unknown id: no explanation on stderr"

          # Sent to Proxmox LXC by --runtime lxc, with no Proxmox here: exit
          # 1, with a clear message
          rc=0; $nx start --runtime lxc ci-smoke 2> err.txt || rc=$?
          cat err.txt
          [ "$rc" -eq 1 ] || fail "start without Proxmox's tools: expected exit 1, got $rc"
          grep -qE "ERROR nexcage: '(pct|pvesh)' not found in PATH; " err.txt || fail "start without Proxmox's tools: no explanation on stderr"

          rc=0; $nx no-such-command 2> /dev/null || rc=$?
          [ "$rc" -eq 2 ] || fail "unknown command: expected exit 2, got $rc"

      - name: Upload binary (ReleaseSafe)
        uses: actions/upload-artifact@v7
        with:
          name: nexcage-linux-amd64
          path: zig-out-release/bin/nexcage
          retention-days: 7

  simulation:
    name: Commands against fake Proxmox tools
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.15.1

      - name: Build (Debug)
        # Debug, so the allocator reports the leaks the run fails on
        run: zig build

      - name: Allow mounts in unprivileged user namespaces
        # run.sh runs nexcage as uid 0 in a user namespace, so it writes
        # /run/nexcage without touching the runner. Ubuntu 24.04's AppArmor
        # default lets such a namespace be created but not mount anything.
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Run tests/sim/run.sh
        run: tests/sim/run.sh

  scripts:
    name: Shell scripts
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Every shell script under scripts/, tests/ and packaging/, found by
      # name or by its #! line. Errors fail the job; the tree has none.
      # Warnings are not checked yet.
      - name: shellcheck, errors only
        run: |
          set -euo pipefail
          command -v shellcheck > /dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck; }
          files=()
          while IFS= read -r f; do
            case "$f" in
              *.sh|*.bash) files+=("$f") ;;
              *) if head -n1 "$f" | grep -qE '^#!.*[/ ](ba|da)?sh( |$)'; then files+=("$f"); fi ;;
            esac
          done < <(git ls-files scripts tests packaging)
          [ "${#files[@]}" -gt 0 ] || { echo "::error::no shell scripts found"; exit 1; }
          shellcheck --version | sed -n 2p
          echo "checking ${#files[@]} scripts"
          shellcheck -S error "${files[@]}"

      # Each test runs a copy of a script from scripts/ against fakes of the
      # tools it calls. Nothing is downloaded, and what a test makes outside
      # its scratch directory it removes.
      - name: tests/scripts/run.sh
        run: tests/scripts/run.sh
