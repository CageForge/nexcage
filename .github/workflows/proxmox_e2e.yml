name: Proxmox E2E (Self-Hosted)

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: proxmox-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Proxmox Self-Hosted E2E
    # pve9 is the label of the node kubemox provisions from
    # nexcage-pve-tpl-v0-2 (deploy/kubernetes/tenant-nexcage). Naming it
    # rather than plain "proxmox" keeps this job on a Proxmox VE 9.x host,
    # which is what the OCI registry step below needs.
    runs-on: [self-hosted, pve9]
    timeout-minutes: 30

    steps:
    - name: Remove root-owned leftovers before checkout
      # An earlier run left a root-owned .cache in the workspace, and checkout
      # then fails with EACCES while cleaning it. This only helps where the
      # runner's sudoers allow it; otherwise delete the directory once by hand.
      run: |
        target="${GITHUB_WORKSPACE}/.cache"
        if [ -e "$target" ] && ! rm -rf "$target" 2>/dev/null; then
          sudo -n rm -rf "$target" 2>/dev/null \
            || echo "::warning::cannot remove root-owned $target; run 'sudo rm -rf $target' on the runner"
        fi

    - name: Checkout
      uses: actions/checkout@v4

    - name: Print environment info
      run: |
        echo "Runner: $(hostname)"
        echo "Kernel: $(uname -a)"
        echo "User: $(whoami)"
        command -v pct && pct version || true
        command -v pveversion && pveversion -v || true
        command -v zig && zig version || true

    - name: Setup Zig
      uses: goto-bus-stop/setup-zig@v2
      with:
        version: 0.15.1

    - name: Build (Debug)
      run: zig build

    - name: Smoke tests (no root required)
      run: |
        set -euo pipefail
        ./zig-out/bin/nexcage --help
        ./zig-out/bin/nexcage version

    - name: Upload binary artifact
      uses: actions/upload-artifact@v4
      with:
        name: nexcage-selfhosted-amd64
        path: zig-out/bin/nexcage
        retention-days: 7

    # Drives containers through nexcage itself. This job used to call pct
    # directly, so it passed without nexcage ever creating anything.
    - name: E2E through nexcage (lifecycle, config, kill, run, OCI bundle)
      run: |
        set -euo pipefail
        LOG=e2e_lxc.log
        : > "$LOG"
        exec > >(tee -a "$LOG") 2>&1
        export PATH=/usr/sbin:/sbin:/usr/bin:/bin:$PATH

        # nexcage runs pct/pvesh and writes /run/nexcage, so it needs root.
        if [ "$(id -u)" -eq 0 ]; then SUDO=; else SUDO='sudo -n'; fi
        NEXCAGE="$PWD/zig-out/bin/nexcage"
        if [ -n "$SUDO" ] && ! $SUDO "$NEXCAGE" version >/dev/null 2>&1; then
          echo "::error::'sudo -n $NEXCAGE' is not allowed; grant the runner user NOPASSWD sudo for it"
          exit 1
        fi
        nx() { $SUDO "$NEXCAGE" "$@"; }

        echo "[E2E] Detect template (vztmpl)"
        # A system template, not merely the first vztmpl volume. On Proxmox VE
        # 9.1+ an OCI image pulled from a registry also lands in vztmpl, and
        # nexcage's own `run docker.io/...` puts one there — so "the first
        # vztmpl" can be an application image with no /sbin/init. Everything
        # below creates containers that have to boot, and the OCI bundle step
        # uses this same archive as its rootfs, so picking one of those fails
        # confusingly at `start` rather than here.
        SYSTEM_TEMPLATE_RE='vztmpl/(debian|ubuntu|alpine|rocky|almalinux|centos|fedora|opensuse|archlinux|devuan|gentoo)-'
        TPL=${TPL:-}
        if [ -z "$TPL" ]; then
          TPL=$($SUDO pvesm list local --content vztmpl 2>/dev/null \
            | awk -v re="$SYSTEM_TEMPLATE_RE" '$1 ~ re {print $1; exit}') || true
        fi
        if [ -z "$TPL" ]; then
          f=$(ls -1 /var/lib/vz/template/cache/*.tar.* 2>/dev/null \
            | grep -E '/(debian|ubuntu|alpine|rocky|almalinux|centos|fedora|opensuse|archlinux|devuan|gentoo)-' \
            | head -n1) || true
          if [ -n "$f" ]; then TPL="local:vztmpl/$(basename "$f")"; fi
        fi
        if [ -z "$TPL" ]; then
          echo "::error::no LXC system template found; pre-seed one with 'pveam download local <template>'"
          $SUDO pvesm list local --content vztmpl 2>/dev/null || true
          exit 1
        fi

        ROOTFS=${ROOTFS:-}
        if [ -z "$ROOTFS" ]; then
          if $SUDO pvesm status | awk '{print $1}' | grep -qx local-lvm; then ROOTFS=local-lvm; else ROOTFS=local; fi
        fi

        BRIDGE=${BRIDGE:-vmbr50}
        if ! ip -br link | awk '{print $1}' | grep -qx "$BRIDGE"; then
          echo "::error::bridge $BRIDGE not found on the runner"
          exit 1
        fi
        echo "Template: $TPL  Storage: $ROOTFS  Bridge: $BRIDGE"

        # nexcage reads ./config.json before /etc/nexcage/config.json
        cat > config.json <<EOF
        {
          "network": { "bridge": "$BRIDGE" },
          "proxmox": { "storage": "$ROOTFS", "rootfs_size_gb": 2 }
        }
        EOF

        NAME="gh-e2e-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
        RUN_NAME="$NAME-run"
        OCI_NAME="$NAME-oci"
        BUNDLE="/var/lib/nexcage/bundles/$OCI_NAME"

        vmid_of() { $SUDO pct list 2>/dev/null | awk -v n="$1" 'NR>1 && $NF==n {print $1}'; }
        cleanup() {
          set +e
          for n in "$NAME" "$RUN_NAME" "$OCI_NAME"; do
            id=$(vmid_of "$n")
            [ -z "$id" ] && continue
            echo "[E2E] Cleanup $n vmid=$id"
            $SUDO pct shutdown "$id" --timeout 30 --forceStop 1 >/dev/null 2>&1
            $SUDO pct destroy "$id" --purge 1 >/dev/null 2>&1
          done
          $SUDO rm -rf "$BUNDLE"
        }
        trap cleanup EXIT

        status_of() { nx state "$1" | sed -n 's/.*"status": "\([a-z]*\)".*/\1/p'; }
        expect_status() {
          local name=$1 want=$2 got=
          for _ in $(seq 1 30); do
            got=$(status_of "$name" || true)
            if [ "$got" = "$want" ]; then echo "[E2E] state of $name: $got"; return 0; fi
            sleep 2
          done
          echo "::error::expected state '$want' for $name, last saw '$got'"
          return 1
        }
        # exit status 1 is a failed operation, 2 a usage error
        expect_exit() {
          local want=$1 rc=0
          shift
          "$@" || rc=$?
          if [ "$rc" -ne "$want" ]; then echo "::error::expected exit $want, got $rc: $*"; return 1; fi
          echo "[E2E] exit $rc as expected: $*"
        }
        conf_has() {
          if ! $SUDO pct config "$1" | grep -qE "$2"; then
            echo "::error::no line matching '$2' in pct config $1:"
            $SUDO pct config "$1"
            return 1
          fi
        }

        echo "[E2E] create"
        nx create --name "$NAME" "$TPL"
        expect_status "$NAME" created
        ID=$(vmid_of "$NAME")

        echo "[E2E] the config file reached the container (pct config $ID), unprivileged by default"
        conf_has "$ID" "^hostname: $NAME\$"
        conf_has "$ID" "^net0: .*bridge=$BRIDGE(,|\$)"
        conf_has "$ID" "^rootfs: $ROOTFS:.*size=2G"
        conf_has "$ID" "^unprivileged: 1\$"

        echo "[E2E] exit codes: a duplicate name fails, bad usage is 2"
        expect_exit 1 nx create --name "$NAME" "$TPL"
        expect_exit 2 nx create --name bad_name "$TPL"
        expect_exit 2 nx start --runtime bogus "$NAME"

        echo "[E2E] list shows the container"
        nx list | awk -F'\t' -v n="$NAME" '$7==n {found=1} END {exit !found}'
        if [ -n "$SUDO" ]; then
          echo "[E2E] list without root fails instead of printing an empty table"
          expect_exit 1 "$NEXCAGE" list
        fi

        echo "[E2E] start"
        nx start "$NAME"
        expect_status "$NAME" running

        echo "[E2E] a global option after the command"
        got=$(nx state --log-level warn "$NAME" | sed -n 's/.*"id": "\(.*\)".*/\1/p')
        if [ "$got" != "$NAME" ]; then
          echo "::error::'state --log-level warn $NAME' reported id '$got'"
          exit 1
        fi

        echo "[E2E] state reports the host PID of the container's init"
        pid=$(nx state "$NAME" | sed -n 's/.*"pid": \([0-9]*\).*/\1/p')
        want=$($SUDO pct status "$ID" --verbose | awk '$1=="pid:" {print $2}')
        if [ -z "$pid" ] || [ "$pid" = 0 ] || [ "$pid" != "$want" ]; then
          echo "::error::state reported pid '$pid'; pct status --verbose says '$want'"
          exit 1
        fi
        echo "[E2E] init of $NAME is host PID $pid"

        echo "[E2E] exec runs a command in the container and passes its status back"
        got=$(nx exec "$NAME" -- sh -c 'echo from-inside')
        [ "$got" = from-inside ] || { echo "::error::exec printed '$got'"; exit 1; }
        expect_exit 7 nx exec "$NAME" -- sh -c 'exit 7'
        expect_exit 2 nx exec "$NAME"
        expect_exit 1 nx exec no-such-container-$$ true

        echo "[E2E] kill signals the init from the host, without pct exec"
        nx kill "$NAME" SIGCONT
        expect_status "$NAME" running
        expect_exit 2 nx kill "$NAME" 'TERM;id'
        expect_exit 2 nx kill "$NAME" NOSUCHSIGNAL

        echo "[E2E] stop"
        nx stop "$NAME"
        expect_status "$NAME" stopped
        expect_exit 1 nx kill "$NAME" SIGCONT

        echo "[E2E] a container created from a template reports bundle null"
        nx state "$NAME" | grep -q '"bundle": null' \
          || { echo "::error::a template-created container should report bundle null"; exit 1; }

        echo "[E2E] --root keeps state out of /run/nexcage"
        ALTROOT=$(mktemp -d)
        ALT_NAME="$NAME-rooted"
        nx --root "$ALTROOT" create --name "$ALT_NAME" "$TPL"
        [ -f "$ALTROOT/$ALT_NAME/state.json" ] \
          || { echo "::error::--root $ALTROOT holds no state for $ALT_NAME"; ls -R "$ALTROOT"; exit 1; }
        [ ! -e "/run/nexcage/$ALT_NAME" ] \
          || { echo "::error::--root was given but state also landed in /run/nexcage"; exit 1; }
        nx --root "$ALTROOT" delete "$ALT_NAME"
        $SUDO rm -rf "$ALTROOT"

        echo "[E2E] delete"
        nx delete "$NAME"
        if [ -n "$(vmid_of "$NAME")" ]; then
          echo "::error::pct still lists $NAME after delete"
          exit 1
        fi

        echo "[E2E] commands on a missing container fail"
        expect_exit 1 nx state "$NAME"
        expect_exit 1 nx start "$NAME"

        echo "[E2E] run with --config: the named file wins over ./config.json"
        ALT="$PWD/e2e-alt-config.json"
        cat > "$ALT" <<EOF
        {
          "network": { "bridge": "$BRIDGE" },
          "proxmox": { "storage": "$ROOTFS", "rootfs_size_gb": 3 }
        }
        EOF
        nx run --config "$ALT" --name "$RUN_NAME" "$TPL"
        expect_status "$RUN_NAME" running
        conf_has "$(vmid_of "$RUN_NAME")" "^rootfs: $ROOTFS:.*size=3G"

        echo "[E2E] kill SIGKILL ends the init, and the container stops"
        nx kill "$RUN_NAME" SIGKILL
        expect_status "$RUN_NAME" stopped
        nx delete "$RUN_NAME"

        echo "[E2E] delete --force destroys a running container"
        nx run --name "$RUN_NAME" "$TPL"
        expect_status "$RUN_NAME" running
        expect_exit 1 nx delete "$RUN_NAME"
        nx delete "$RUN_NAME" --force
        if [ -n "$(vmid_of "$RUN_NAME")" ]; then
          echo "::error::pct still lists $RUN_NAME after delete --force"
          exit 1
        fi

        echo "[E2E] create <id> --bundle <dir>, and state reports that bundle"
        $SUDO mkdir -p "$BUNDLE/rootfs"
        $SUDO tar -xpf "$($SUDO pvesm path "$TPL")" -C "$BUNDLE/rootfs"
        echo '{"ociVersion":"1.0.2","process":{"args":["/sbin/init"],"cwd":"/"},"root":{"path":"rootfs"}}' \
          | $SUDO tee "$BUNDLE/config.json" >/dev/null
        # The runtime-spec form: the id positionally, the bundle behind --bundle
        nx create "$OCI_NAME" --bundle "$BUNDLE"
        expect_status "$OCI_NAME" created
        got=$(nx state "$OCI_NAME" | sed -n 's/.*"bundle": "\(.*\)".*/\1/p')
        [ "$got" = "$BUNDLE" ] || { echo "::error::state reported bundle '$got', expected $BUNDLE"; exit 1; }
        if $SUDO pvesm list local --content vztmpl | grep -q "vztmpl/nexcage-$OCI_NAME-"; then
          echo "::error::the template packed from the bundle is still on storage local"
          exit 1
        fi
        nx start "$OCI_NAME"
        expect_status "$OCI_NAME" running
        nx stop "$OCI_NAME"
        expect_status "$OCI_NAME" stopped
        nx delete "$OCI_NAME"
        $SUDO rm -rf "$BUNDLE"

        trap - EXIT
        echo "[E2E] all passed"

    - name: E2E through nexcage (OCI registry image)
      # Only Proxmox VE 9.1 and later can pull an image from a registry, so
      # this is the first E2E host where the path can be exercised at all.
      run: |
        set -euo pipefail
        LOG=e2e_registry.log
        : > "$LOG"
        exec > >(tee -a "$LOG") 2>&1
        export PATH=/usr/sbin:/sbin:/usr/bin:/bin:$PATH

        if [ "$(id -u)" -eq 0 ]; then SUDO=; else SUDO='sudo -n'; fi
        NEXCAGE="$PWD/zig-out/bin/nexcage"
        nx() { $SUDO "$NEXCAGE" "$@"; }

        read -r major minor <<<"$($SUDO pveversion | sed -n 's|^pve-manager/\([0-9]*\)\.\([0-9]*\).*|\1 \2|p')"
        if [ "${major:-0}" -lt 9 ] || { [ "${major:-0}" -eq 9 ] && [ "${minor:-0}" -lt 1 ]; }; then
          echo "::notice::Proxmox VE ${major:-?}.${minor:-?} cannot pull from a registry; skipping"
          exit 0
        fi
        echo "[E2E] Proxmox VE $major.$minor supports oci-registry-pull"

        IMAGE=${OCI_IMAGE:-docker.io/library/redis:7}
        NAME="gh-e2e-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-reg"

        vmid_of() { $SUDO pct list 2>/dev/null | awk -v n="$1" 'NR>1 && $NF==n {print $1}'; }
        vztmpl_list() { $SUDO pvesm list local --content vztmpl 2>/dev/null | awk 'NR>1 {print $1}' | sort; }

        # The pull leaves the image in vztmpl, where it stays after the
        # container is gone. Freeing it keeps the host's template list to
        # system templates, which is what the detection above looks for.
        before=$(vztmpl_list)
        cleanup() {
          set +e
          id=$(vmid_of "$NAME")
          if [ -n "$id" ]; then
            $SUDO pct shutdown "$id" --timeout 30 --forceStop 1 >/dev/null 2>&1
            $SUDO pct destroy "$id" --purge 1 >/dev/null 2>&1
          fi
          for vol in $(comm -13 <(echo "$before") <(vztmpl_list)); do
            echo "[E2E] freeing pulled image $vol"
            $SUDO pvesm free "$vol" >/dev/null 2>&1
          done
        }
        trap cleanup EXIT

        echo "[E2E] run $IMAGE"
        nx run --name "$NAME" "$IMAGE"

        got=
        for _ in $(seq 1 30); do
          got=$(nx state "$NAME" | sed -n 's/.*"status": "\([a-z]*\)".*/\1/p' || true)
          [ "$got" = running ] && break
          sleep 2
        done
        [ "$got" = running ] || { echo "::error::expected $NAME running, saw '$got'"; exit 1; }

        pid=$(nx state "$NAME" | sed -n 's/.*"pid": \([0-9]*\).*/\1/p')
        [ -n "$pid" ] && [ "$pid" != 0 ] || { echo "::error::state reported pid '$pid'"; exit 1; }
        echo "[E2E] $NAME from $IMAGE runs as host PID $pid"

        echo "[E2E] images from a registry always run unprivileged"
        $SUDO pct config "$(vmid_of "$NAME")" | grep -qE '^unprivileged: 1$' \
          || { echo "::error::container from a registry image is not unprivileged"; exit 1; }

        nx stop "$NAME"
        nx delete "$NAME"
        cleanup
        trap - EXIT
        echo "[E2E] registry path passed"

    - name: Upload E2E logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: proxmox-e2e-logs
        path: e2e_lxc.log
        retention-days: 7

    - name: Cleanup leftover E2E containers (always)
      if: always()
      run: |
        set -euo pipefail
        export PATH=/usr/sbin:/sbin:/usr/bin:/bin:$PATH
        if command -v sudo >/dev/null 2>&1; then SUDO='sudo -n'; else SUDO=; fi
        ALL_IDS=$($SUDO pct list 2>/dev/null | awk 'NR>1 {print $1}' || true)
        for id in $ALL_IDS; do
          name=$($SUDO pct config "$id" 2>/dev/null | awk -F': ' '/^hostname:/{print $2}')
          if [ -n "${name:-}" ] && [ "${name#gh-e2e-}" != "$name" ]; then
            echo "[E2E] Final cleanup vmid=$id ($name)"
            $SUDO pct shutdown "$id" --timeout 30 --forceStop 1 || true
            $SUDO pct stop "$id" || true
            for i in $(seq 1 10); do
              st=$($SUDO pct status "$id" 2>/dev/null || true)
              echo "$st" | grep -q running || break
              sleep 2
            done
            $SUDO pct destroy "$id" --purge 1 || true
          fi
        done
        # Bundles and packed templates a failed run can leave behind
        $SUDO find /var/lib/nexcage/bundles -maxdepth 1 -name 'gh-e2e-*' -exec rm -rf {} + 2>/dev/null || true
        for volid in $($SUDO pvesm list local --content vztmpl 2>/dev/null | awk '$1 ~ /:vztmpl\/nexcage-gh-e2e-/ {print $1}'); do
          echo "[E2E] Final cleanup template $volid"
          $SUDO rm -f "$($SUDO pvesm path "$volid")" || true
        done
