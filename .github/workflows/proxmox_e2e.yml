name: Proxmox E2E (Self-Hosted)

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: proxmox-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Proxmox Self-Hosted E2E
    # pve9 is the label of the node kubemox provisions from
    # nexcage-pve-tpl-v0-2 (deploy/kubernetes/tenant-nexcage). Naming it
    # rather than plain "proxmox" keeps this job on a Proxmox VE 9.x host,
    # which is what the OCI registry step below needs.
    # A pull request from a fork must not run code on this machine: the
    # runner user has sudo for everything (#362). A maintainer runs the job on
    # such code by pushing it to a branch here.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, pve9]
    timeout-minutes: 30

    steps:
    - name: Remove root-owned leftovers before checkout
      # An earlier run left a root-owned .cache in the workspace, and checkout
      # then fails with EACCES while cleaning it. This only helps where the
      # runner's sudoers allow it; otherwise delete the directory once by hand.
      run: |
        target="${GITHUB_WORKSPACE}/.cache"
        if [ -e "$target" ] && ! rm -rf "$target" 2>/dev/null; then
          sudo -n rm -rf "$target" 2>/dev/null \
            || echo "::warning::cannot remove root-owned $target; run 'sudo rm -rf $target' on the runner"
        fi

    - name: Checkout
      uses: actions/checkout@v7

    - name: Print environment info
      run: |
        echo "Runner: $(hostname)"
        echo "Kernel: $(uname -a)"
        echo "User: $(whoami)"
        command -v pct && pct version || true
        command -v pveversion && pveversion -v || true
        command -v zig && zig version || true

    - name: Setup Zig
      uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
      with:
        version: 0.15.1

    - name: Build (Debug)
      run: zig build

    - name: Smoke tests (no root required)
      run: |
        set -euo pipefail
        ./zig-out/bin/nexcage --help
        ./zig-out/bin/nexcage version

    - name: Upload binary artifact
      uses: actions/upload-artifact@v4
      with:
        name: nexcage-selfhosted-amd64
        path: zig-out/bin/nexcage
        retention-days: 7

    # Drives containers through nexcage itself. This job used to call pct
    # directly, so it passed without nexcage ever creating anything.
    - name: E2E through nexcage (lifecycle, config, kill, run, OCI bundle)
      run: |
        set -euo pipefail
        LOG=e2e_lxc.log
        : > "$LOG"
        exec > >(tee -a "$LOG") 2>&1
        export PATH=/usr/sbin:/sbin:/usr/bin:/bin:$PATH

        # nexcage runs pct/pvesh and writes /run/nexcage, so it needs root.
        if [ "$(id -u)" -eq 0 ]; then SUDO=; else SUDO='sudo -n'; fi
        NEXCAGE="$PWD/zig-out/bin/nexcage"
        if [ -n "$SUDO" ] && ! $SUDO "$NEXCAGE" version >/dev/null 2>&1; then
          echo "::error::'sudo -n $NEXCAGE' is not allowed; grant the runner user NOPASSWD sudo for it"
          exit 1
        fi
        nx() { $SUDO "$NEXCAGE" "$@"; }

        echo "[E2E] Detect template (vztmpl)"
        # A system template, not merely the first vztmpl volume. On Proxmox VE
        # 9.1+ an OCI image pulled from a registry also lands in vztmpl, and
        # nexcage's own `run docker.io/...` puts one there — so "the first
        # vztmpl" can be an application image with no /sbin/init. Everything
        # below creates containers that have to boot, and the OCI bundle step
        # uses this same archive as its rootfs, so picking one of those fails
        # confusingly at `start` rather than here.
        SYSTEM_TEMPLATE_RE='vztmpl/(debian|ubuntu|alpine|rocky|almalinux|centos|fedora|opensuse|archlinux|devuan|gentoo)-'
        TPL=${TPL:-}
        if [ -z "$TPL" ]; then
          TPL=$($SUDO pvesm list local --content vztmpl 2>/dev/null \
            | awk -v re="$SYSTEM_TEMPLATE_RE" '$1 ~ re {print $1; exit}') || true
        fi
        if [ -z "$TPL" ]; then
          f=$(ls -1 /var/lib/vz/template/cache/*.tar.* 2>/dev/null \
            | grep -E '/(debian|ubuntu|alpine|rocky|almalinux|centos|fedora|opensuse|archlinux|devuan|gentoo)-' \
            | head -n1) || true
          if [ -n "$f" ]; then TPL="local:vztmpl/$(basename "$f")"; fi
        fi
        if [ -z "$TPL" ]; then
          echo "::error::no LXC system template found; pre-seed one with 'pveam download local <template>'"
          $SUDO pvesm list local --content vztmpl 2>/dev/null || true
          exit 1
        fi

        ROOTFS=${ROOTFS:-}
        if [ -z "$ROOTFS" ]; then
          if $SUDO pvesm status | awk '{print $1}' | grep -qx local-lvm; then ROOTFS=local-lvm; else ROOTFS=local; fi
        fi

        # The snapshot checks need a storage that can snapshot: lvm-thin or ZFS.
        # `local` is a directory storage, where a container's rootfs is a raw
        # volume that cannot be. 03-prepare-runner-host.sh makes a ZFS pool on
        # a file for this; a node without any such storage skips the checks and
        # says so.
        SNAPSTORE=${SNAPSTORE:-}
        if [ -z "$SNAPSTORE" ]; then
          SNAPSTORE=$($SUDO pvesm status | awk '$2=="lvmthin" || $2=="zfspool" {print $1; exit}') || true
        fi

        BRIDGE=${BRIDGE:-vmbr50}
        if ! ip -br link | awk '{print $1}' | grep -qx "$BRIDGE"; then
          echo "::error::bridge $BRIDGE not found on the runner"
          exit 1
        fi
        echo "Template: $TPL  Storage: $ROOTFS  Snapshot storage: ${SNAPSTORE:-none}  Bridge: $BRIDGE"

        # nexcage reads ./config.json before /etc/nexcage/config.json
        cat > config.json <<EOF
        {
          "network": { "bridge": "$BRIDGE" },
          "proxmox": { "storage": "$ROOTFS", "rootfs_size_gb": 2 }
        }
        EOF

        NAME="gh-e2e-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
        RUN_NAME="$NAME-run"
        OCI_NAME="$NAME-oci"
        SNAP_NAME="$NAME-snap"
        OPT_NAME="$NAME-opt"
        BUNDLE="/var/lib/nexcage/bundles/$OCI_NAME"

        vmid_of() { $SUDO pct list 2>/dev/null | awk -v n="$1" 'NR>1 && $NF==n {print $1}'; }
        cleanup() {
          set +e
          for n in "$NAME" "$RUN_NAME" "$OCI_NAME" "$SNAP_NAME" "$OPT_NAME"; do
            id=$(vmid_of "$n")
            [ -z "$id" ] && continue
            echo "[E2E] Cleanup $n vmid=$id"
            $SUDO pct shutdown "$id" --timeout 30 --forceStop 1 >/dev/null 2>&1
            $SUDO pct destroy "$id" --purge 1 >/dev/null 2>&1
          done
          $SUDO rm -rf "$BUNDLE"
        }
        trap cleanup EXIT

        status_of() { nx state "$1" | sed -n 's/.*"status": "\([a-z]*\)".*/\1/p'; }
        expect_status() {
          local name=$1 want=$2 got=
          for _ in $(seq 1 30); do
            got=$(status_of "$name" || true)
            if [ "$got" = "$want" ]; then echo "[E2E] state of $name: $got"; return 0; fi
            sleep 2
          done
          echo "::error::expected state '$want' for $name, last saw '$got'"
          return 1
        }
        # exit status 1 is a failed operation, 2 a usage error
        expect_exit() {
          local want=$1 rc=0
          shift
          "$@" || rc=$?
          if [ "$rc" -ne "$want" ]; then echo "::error::expected exit $want, got $rc: $*"; return 1; fi
          echo "[E2E] exit $rc as expected: $*"
        }
        conf_has() {
          if ! $SUDO pct config "$1" | grep -qE "$2"; then
            echo "::error::no line matching '$2' in pct config $1:"
            $SUDO pct config "$1"
            return 1
          fi
        }

        echo "[E2E] create"
        nx create --name "$NAME" "$TPL"
        expect_status "$NAME" created
        ID=$(vmid_of "$NAME")

        echo "[E2E] the config file reached the container (pct config $ID), unprivileged by default"
        conf_has "$ID" "^hostname: $NAME\$"
        conf_has "$ID" "^net0: .*bridge=$BRIDGE(,|\$)"
        conf_has "$ID" "^rootfs: $ROOTFS:.*size=2G"
        conf_has "$ID" "^unprivileged: 1\$"

        # What pct create is usually given (#308), read back from the
        # container's configuration rather than trusted from create's exit
        # status. Proxmox orders net0's keys itself, so each is matched alone.
        echo "[E2E] create takes pct's options: limits as update says them, net0, onboot, tags, a mount point"
        nx create --name "$OPT_NAME" --memory 768M --memory-swap 1G --cores 2 --cpu-quota 50000 --cpu-share 512 \
          --ip 192.0.2.10/24 --gw 192.0.2.1 --vlan 20 --firewall --onboot --tags 'nexcage;e2e' \
          --mp "$ROOTFS:1,mp=/mnt/e2e" "$TPL"
        OID=$(vmid_of "$OPT_NAME")
        conf_has "$OID" "^memory: 768\$"
        conf_has "$OID" "^swap: 256\$"
        conf_has "$OID" "^cores: 2\$"
        conf_has "$OID" "^cpulimit: 0\.5\$"
        conf_has "$OID" "^cpuunits: 20\$"
        conf_has "$OID" "^net0: (.*,)?ip=192\.0\.2\.10/24(,|\$)"
        conf_has "$OID" "^net0: (.*,)?gw=192\.0\.2\.1(,|\$)"
        conf_has "$OID" "^net0: (.*,)?tag=20(,|\$)"
        conf_has "$OID" "^net0: (.*,)?firewall=1(,|\$)"
        conf_has "$OID" "^onboot: 1\$"
        conf_has "$OID" "^tags: .*e2e"
        conf_has "$OID" "^tags: .*nexcage"
        conf_has "$OID" "^mp0: $ROOTFS:.*mp=/mnt/e2e"
        nx delete "$OPT_NAME"

        echo "[E2E] exit codes: a duplicate name fails, bad usage is 2"
        expect_exit 1 nx create --name "$NAME" "$TPL"
        expect_exit 2 nx create --name bad_name "$TPL"
        expect_exit 2 nx start --runtime bogus "$NAME"

        echo "[E2E] list shows the container"
        # $8, not $7: NODE comes before NAMES now that list covers the cluster.
        nx list | awk -F'\t' -v n="$NAME" '$8==n {found=1} END {exit !found}'
        echo "[E2E] and the NODE column names this host"
        nx list | awk -F'\t' -v n="$NAME" -v h="$(hostname)" '$8==n && $7==h {found=1} END {exit !found}'
        if [ -n "$SUDO" ]; then
          echo "[E2E] list without root fails instead of printing an empty table"
          expect_exit 1 "$NEXCAGE" list
        fi

        echo "[E2E] start"
        nx start "$NAME"
        expect_status "$NAME" running

        echo "[E2E] a global option after the command"
        got=$(nx state --log-level warn "$NAME" | sed -n 's/.*"id": "\(.*\)".*/\1/p')
        if [ "$got" != "$NAME" ]; then
          echo "::error::'state --log-level warn $NAME' reported id '$got'"
          exit 1
        fi

        echo "[E2E] state reports the host PID of the container's init"
        pid=$(nx state "$NAME" | sed -n 's/.*"pid": \([0-9]*\).*/\1/p')
        want=$($SUDO pct status "$ID" --verbose | awk '$1=="pid:" {print $2}')
        if [ -z "$pid" ] || [ "$pid" = 0 ] || [ "$pid" != "$want" ]; then
          echo "::error::state reported pid '$pid'; pct status --verbose says '$want'"
          exit 1
        fi
        echo "[E2E] init of $NAME is host PID $pid"

        echo "[E2E] exec runs a command in the container and passes its status back"
        got=$(nx exec "$NAME" -- sh -c 'echo from-inside')
        [ "$got" = from-inside ] || { echo "::error::exec printed '$got'"; exit 1; }
        expect_exit 7 nx exec "$NAME" -- sh -c 'exit 7'
        expect_exit 2 nx exec "$NAME"
        expect_exit 1 nx exec no-such-container-$$ true

        echo "[E2E] kill signals the init from the host, without pct exec"
        nx kill "$NAME" SIGCONT
        expect_status "$NAME" running
        expect_exit 2 nx kill "$NAME" 'TERM;id'
        expect_exit 2 nx kill "$NAME" NOSUCHSIGNAL

        echo "[E2E] pause freezes the container's cgroup, and the kernel agrees it is frozen"
        FREEZER="/sys/fs/cgroup/lxc/$ID"
        # cgroup.freeze is what nexcage asked for; cgroup.events is the kernel
        # saying it took effect, which it does once every task is actually
        # frozen (or thawed). Only the second one is evidence, and it can lag
        # the write by a moment.
        expect_frozen() {
          local want=$1
          for _ in $(seq 1 10); do
            if $SUDO grep -qx "frozen $want" "$FREEZER/cgroup.events"; then
              echo "[E2E] $FREEZER/cgroup.events: frozen $want"; return 0
            fi
            sleep 1
          done
          echo "::error::$FREEZER/cgroup.events never said 'frozen $want':"
          $SUDO cat "$FREEZER/cgroup.events" "$FREEZER/cgroup.freeze"
          return 1
        }
        nx pause "$NAME"
        expect_status "$NAME" paused
        expect_frozen 1
        echo "[E2E] pct still calls it running -- which is why state reads the freezer"
        pct_says=$($SUDO pct status "$ID" | awk '{print $2}')
        [ "$pct_says" = running ] || echo "::warning::pct status now says '$pct_says' for a frozen container; CLI_REFERENCE says it says running"
        echo "[E2E] list says paused too, rather than disagreeing with state"
        nx list | awk -F'\t' -v n="$NAME" '$8==n && $5=="paused" {found=1} END {exit !found}'

        echo "[E2E] a command sent into a frozen container is held, and runs once it is thawed"
        # One exec proves both halves. Started now, it cannot finish: the
        # process lxc-attach puts into the container's cgroup is frozen the
        # moment it arrives there. After resume that same process runs, prints
        # and exits -- which also means the test leaves nothing frozen behind.
        #
        # Not `timeout nx ...`: nx is a shell function and timeout can only
        # exec a program. The first version of this check did exactly that,
        # got 127 in five milliseconds, and took it for "did not succeed".
        EXEC_OUT=$(mktemp)
        $SUDO "$NEXCAGE" exec "$NAME" -- sh -c 'echo thawed' >"$EXEC_OUT" 2>&1 &
        EXEC_PID=$!
        # /proc rather than kill -0: the child is sudo, which is root's, and a
        # zombie is a finished exec, not a held one.
        exec_alive() { [ -r "/proc/$EXEC_PID/status" ] && ! grep -q '^State:.*Z' "/proc/$EXEC_PID/status"; }
        # An exec on this host takes a few seconds when nothing is frozen, so
        # the wait has to be several times that to mean anything.
        HOLD=20
        sleep "$HOLD"
        if ! exec_alive; then
          rc=0; wait "$EXEC_PID" || rc=$?
          echo "::error::exec finished inside a paused container within ${HOLD}s (rc=$rc, output: '$(cat "$EXEC_OUT")')"
          exit 1
        fi
        echo "[E2E] the exec has been held for ${HOLD}s by the freezer"

        echo "[E2E] resume thaws it"
        nx resume "$NAME"
        expect_status "$NAME" running
        expect_frozen 0
        # The held exec must now finish on its own. Bounded, so a hang here
        # fails the job with a message instead of eating its timeout.
        for _ in $(seq 1 30); do exec_alive || break; sleep 2; done
        if exec_alive; then
          echo "::error::the exec started while paused is still not finished 60s after resume"
          $SUDO kill "$EXEC_PID" 2>/dev/null || true
          exit 1
        fi
        rc=0; wait "$EXEC_PID" || rc=$?
        got=$(cat "$EXEC_OUT"); rm -f "$EXEC_OUT"
        if [ "$rc" -ne 0 ] || [ "$got" != thawed ]; then
          echo "::error::the held exec ended with rc=$rc and printed '$got'"
          exit 1
        fi
        echo "[E2E] and it ran to completion after resume, printing '$got'"

        echo "[E2E] update changes the limits Proxmox can express, and the kernel shows them"
        # runc's words into pct's, then the cgroup Proxmox writes for the
        # container -- lxc/<vmid>, not its ns child -- is the kernel's word on
        # what applies. 768M is 805306368 bytes; 50000/100000 is cpulimit 0.5;
        # 1024 shares is weight 39 by runc's conversion, and pct's own default
        # weight is 100, so 39 cannot be there by accident.
        nx update --memory 768M --cpu-quota 50000 --cpu-period 100000 --cpu-share 1024 "$NAME"
        conf_has "$ID" "^memory: 768\$"
        conf_has "$ID" "^cpulimit: 0.5\$"
        conf_has "$ID" "^cpuunits: 39\$"
        for pair in "memory.max=805306368" "cpu.max=50000 100000" "cpu.weight=39"; do
          f=${pair%%=*}; want=${pair#*=}
          got=$($SUDO cat "$FREEZER/$f")
          [ "$got" = "$want" ] || { echo "::error::$FREEZER/$f is '$got' after update; wanted '$want'"; exit 1; }
          echo "[E2E] $FREEZER/$f = $got"
        done
        echo "[E2E] --memory-swap is memory plus swap, as runc means it; the cgroup gets the swap alone"
        nx update --memory 768M --memory-swap 1G "$NAME"
        conf_has "$ID" "^swap: 256\$"
        got=$($SUDO cat "$FREEZER/memory.swap.max")
        [ "$got" = 268435456 ] || { echo "::error::memory.swap.max is '$got'; wanted 268435456 (1G - 768M)"; exit 1; }
        echo "[E2E] a limit Proxmox cannot express is refused by name, not dropped"
        expect_exit 1 nx update --pids-limit 100 "$NAME"
        echo "[E2E] and an in-place resize the way containerd sends it: --resources=- with the document on stdin"
        printf '{"memory":{"limit":536870912}}' | nx update --resources=- "$NAME"
        got=$($SUDO cat "$FREEZER/memory.max")
        [ "$got" = 536870912 ] || { echo "::error::memory.max is '$got' after a resources document asking for 536870912"; exit 1; }
        echo "[E2E] $FREEZER/memory.max = $got, from the document"

        echo "[E2E] pause and resume on a container that does not exist are errors"
        expect_exit 1 nx pause no-such-container-$$
        expect_exit 1 nx resume no-such-container-$$

        echo "[E2E] a snapshot of a raw volume on the directory storage is Proxmox's refusal, with the line about which storages can"
        # The main container's rootfs is on $ROOTFS. On `local` that is a raw
        # volume, and pct's refusal is what the hint in nexcage keys on; this
        # is where the real pct's wording meets that match.
        if [ "$ROOTFS" = local ]; then
          out=$(nx snapshot "$NAME" e2e-nope 2>&1) && { echo "::error::snapshot on a raw volume on $ROOTFS succeeded; it should not be able to"; exit 1; }
          echo "$out" | grep -q 'cannot take snapshots' \
            || { echo "::error::the refusal lacks nexcage's line about which storages can; pct said:"; echo "$out"; exit 1; }
          echo "[E2E] refused, and the line is there"
        fi

        echo "[E2E] snapshots through pct, on a storage that can: take, list, write a file, roll back, see it gone, delete"
        if [ -n "$SNAPSTORE" ]; then
          SNAPCFG="$PWD/e2e-snap-config.json"
          cat > "$SNAPCFG" <<EOF
        {
          "network": { "bridge": "$BRIDGE" },
          "proxmox": { "storage": "$SNAPSTORE", "rootfs_size_gb": 2 }
        }
        EOF
          nx run --config "$SNAPCFG" --name "$SNAP_NAME" "$TPL"
          expect_status "$SNAP_NAME" running
          SID=$(vmid_of "$SNAP_NAME")
          conf_has "$SID" "^rootfs: $SNAPSTORE:"
          nx snapshot "$SNAP_NAME" e2e-before --description "before the e2e write"
          $SUDO pct listsnapshot "$SID" | grep -q 'e2e-before' \
            || { echo "::error::pct listsnapshot $SID does not show e2e-before after nexcage snapshot"; exit 1; }
          nx snapshots "$SNAP_NAME" | grep -q '^e2e-before' \
            || { echo "::error::nexcage snapshots does not list e2e-before"; nx snapshots "$SNAP_NAME"; exit 1; }
          nx exec "$SNAP_NAME" -- sh -c 'echo after > /root/e2e-after-snapshot'
          nx exec "$SNAP_NAME" -- test -f /root/e2e-after-snapshot
          echo "[E2E] rollback of a running container: Proxmox stops it first, and nexcage's state says stopped"
          # Measured here on PVE 9.2: AbstractConfig::snapshot_rollback kills a
          # running container and rolls back; it exits 0, not with a refusal.
          nx rollback "$SNAP_NAME" e2e-before
          expect_status "$SNAP_NAME" stopped
          nx state "$SNAP_NAME" | grep -q '"status": "stopped"' \
            || { echo "::error::state after the rollback of a running container is not stopped:"; nx state "$SNAP_NAME"; exit 1; }
          nx start "$SNAP_NAME"
          # exec exits with the command's status, so `test -f` on the file
          # written after the snapshot is 1 once the rollback took it away.
          expect_exit 1 nx exec "$SNAP_NAME" -- test -f /root/e2e-after-snapshot
          echo "[E2E] the file written after the snapshot is gone"
          nx exec "$SNAP_NAME" -- sh -c 'echo again > /root/e2e-after-snapshot'
          nx rollback "$SNAP_NAME" e2e-before --start
          expect_status "$SNAP_NAME" running
          expect_exit 1 nx exec "$SNAP_NAME" -- test -f /root/e2e-after-snapshot
          echo "[E2E] rollback --start brought the container up, and the second file is gone too"
          nx delsnapshot "$SNAP_NAME" e2e-before
          expect_exit 1 nx delsnapshot "$SNAP_NAME" e2e-before
          if $SUDO pct listsnapshot "$SID" | grep -q 'e2e-before'; then
            echo "::error::e2e-before is still there after delsnapshot"; exit 1
          fi
          nx delete --force "$SNAP_NAME"
          rm -f "$SNAPCFG"
        else
          echo "::warning::snapshot checks skipped: no lvm-thin or ZFS storage on this node; 03-prepare-runner-host.sh makes a ZFS pool on a file for them"
        fi

        echo "[E2E] stop"
        nx stop "$NAME"
        expect_status "$NAME" stopped
        expect_exit 1 nx kill "$NAME" SIGCONT

        echo "[E2E] a stopped container has no freezer, and pause says so"
        expect_exit 1 nx pause "$NAME"

        echo "[E2E] a container created from a template reports bundle null"
        nx state "$NAME" | grep -q '"bundle": null' \
          || { echo "::error::a template-created container should report bundle null"; exit 1; }

        echo "[E2E] --root keeps state out of /run/nexcage"
        ALTROOT=$(mktemp -d)
        ALT_NAME="$NAME-rooted"
        nx --root "$ALTROOT" create --name "$ALT_NAME" "$TPL"
        [ -f "$ALTROOT/$ALT_NAME/state.json" ] \
          || { echo "::error::--root $ALTROOT holds no state for $ALT_NAME"; ls -R "$ALTROOT"; exit 1; }
        [ ! -e "/run/nexcage/$ALT_NAME" ] \
          || { echo "::error::--root was given but state also landed in /run/nexcage"; exit 1; }
        nx --root "$ALTROOT" delete "$ALT_NAME"
        $SUDO rm -rf "$ALTROOT"

        echo "[E2E] delete"
        nx delete "$NAME"
        if [ -n "$(vmid_of "$NAME")" ]; then
          echo "::error::pct still lists $NAME after delete"
          exit 1
        fi

        echo "[E2E] commands on a missing container fail"
        expect_exit 1 nx state "$NAME"
        expect_exit 1 nx start "$NAME"

        echo "[E2E] run with --config: the named file wins over ./config.json"
        ALT="$PWD/e2e-alt-config.json"
        cat > "$ALT" <<EOF
        {
          "network": { "bridge": "$BRIDGE" },
          "proxmox": { "storage": "$ROOTFS", "rootfs_size_gb": 3 }
        }
        EOF
        nx run --config "$ALT" --name "$RUN_NAME" "$TPL"
        expect_status "$RUN_NAME" running
        conf_has "$(vmid_of "$RUN_NAME")" "^rootfs: $ROOTFS:.*size=3G"

        echo "[E2E] kill SIGKILL ends the init, and the container stops"
        nx kill "$RUN_NAME" SIGKILL
        expect_status "$RUN_NAME" stopped
        nx delete "$RUN_NAME"

        echo "[E2E] delete --force destroys a running container"
        nx run --name "$RUN_NAME" "$TPL"
        expect_status "$RUN_NAME" running
        expect_exit 1 nx delete "$RUN_NAME"
        nx delete "$RUN_NAME" --force
        if [ -n "$(vmid_of "$RUN_NAME")" ]; then
          echo "::error::pct still lists $RUN_NAME after delete --force"
          exit 1
        fi

        echo "[E2E] create <id> --bundle <dir>, and state reports that bundle"
        $SUDO mkdir -p "$BUNDLE/rootfs"
        $SUDO tar -xpf "$($SUDO pvesm path "$TPL")" -C "$BUNDLE/rootfs"
        echo '{"ociVersion":"1.0.2","process":{"args":["/sbin/init"],"cwd":"/"},"root":{"path":"rootfs"}}' \
          | $SUDO tee "$BUNDLE/config.json" >/dev/null
        # The runtime-spec form: the id positionally, the bundle behind --bundle
        nx create "$OCI_NAME" --bundle "$BUNDLE"
        expect_status "$OCI_NAME" created
        got=$(nx state "$OCI_NAME" | sed -n 's/.*"bundle": "\(.*\)".*/\1/p')
        [ "$got" = "$BUNDLE" ] || { echo "::error::state reported bundle '$got', expected $BUNDLE"; exit 1; }
        if $SUDO pvesm list local --content vztmpl | grep -q "vztmpl/nexcage-$OCI_NAME-"; then
          echo "::error::the template packed from the bundle is still on storage local"
          exit 1
        fi
        nx start "$OCI_NAME"
        expect_status "$OCI_NAME" running
        nx stop "$OCI_NAME"
        expect_status "$OCI_NAME" stopped
        nx delete "$OCI_NAME"
        $SUDO rm -rf "$BUNDLE"

        trap - EXIT
        echo "[E2E] all passed"

    - name: E2E through nexcage (OCI registry image)
      # Only Proxmox VE 9.1 and later can pull an image from a registry, so
      # this is the first E2E host where the path can be exercised at all.
      run: |
        set -euo pipefail
        LOG=e2e_registry.log
        : > "$LOG"
        exec > >(tee -a "$LOG") 2>&1
        export PATH=/usr/sbin:/sbin:/usr/bin:/bin:$PATH

        if [ "$(id -u)" -eq 0 ]; then SUDO=; else SUDO='sudo -n'; fi
        NEXCAGE="$PWD/zig-out/bin/nexcage"
        nx() { $SUDO "$NEXCAGE" "$@"; }

        read -r major minor <<<"$($SUDO pveversion | sed -n 's|^pve-manager/\([0-9]*\)\.\([0-9]*\).*|\1 \2|p')"
        if [ "${major:-0}" -lt 9 ] || { [ "${major:-0}" -eq 9 ] && [ "${minor:-0}" -lt 1 ]; }; then
          echo "::notice::Proxmox VE ${major:-?}.${minor:-?} cannot pull from a registry; skipping"
          exit 0
        fi
        echo "[E2E] Proxmox VE $major.$minor supports oci-registry-pull"

        IMAGE=${OCI_IMAGE:-docker.io/library/redis:7}
        NAME="gh-e2e-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-reg"

        vmid_of() { $SUDO pct list 2>/dev/null | awk -v n="$1" 'NR>1 && $NF==n {print $1}'; }
        vztmpl_list() { $SUDO pvesm list local --content vztmpl 2>/dev/null | awk 'NR>1 {print $1}' | sort; }
        # Proxmox records every registry pull as a task of this type, which is
        # the evidence for "did not pull again": the template count cannot be,
        # because a repeated pull is refused by pvesh and leaves the count as
        # it was too.
        pulls_recorded() { $SUDO pvesh get "/nodes/$(hostname)/tasks" --typefilter ociregistrypull --limit 500 --output-format json 2>/dev/null | grep -o '"upid"' | wc -l; }

        # The pull leaves the image in vztmpl, where it stays after the
        # container is gone. Freeing it keeps the host's template list to
        # system templates, which is what the detection above looks for.
        before=$(vztmpl_list)
        cleanup() {
          set +e
          for n in "$NAME" "$NAME-2"; do
            id=$(vmid_of "$n")
            [ -z "$id" ] && continue
            $SUDO pct shutdown "$id" --timeout 30 --forceStop 1 >/dev/null 2>&1
            $SUDO pct destroy "$id" --purge 1 >/dev/null 2>&1
          done
          for vol in $(comm -13 <(echo "$before") <(vztmpl_list)); do
            echo "[E2E] freeing pulled image $vol"
            $SUDO pvesm free "$vol" >/dev/null 2>&1
          done
        }
        trap cleanup EXIT

        echo "[E2E] run $IMAGE"
        nx run --name "$NAME" "$IMAGE"

        got=
        for _ in $(seq 1 30); do
          got=$(nx state "$NAME" | sed -n 's/.*"status": "\([a-z]*\)".*/\1/p' || true)
          [ "$got" = running ] && break
          sleep 2
        done
        [ "$got" = running ] || { echo "::error::expected $NAME running, saw '$got'"; exit 1; }

        pid=$(nx state "$NAME" | sed -n 's/.*"pid": \([0-9]*\).*/\1/p')
        [ -n "$pid" ] && [ "$pid" != 0 ] || { echo "::error::state reported pid '$pid'"; exit 1; }
        echo "[E2E] $NAME from $IMAGE runs as host PID $pid"

        echo "[E2E] images from a registry always run unprivileged"
        $SUDO pct config "$(vmid_of "$NAME")" | grep -qE '^unprivileged: 1$' \
          || { echo "::error::container from a registry image is not unprivileged"; exit 1; }

        echo "[E2E] a second create from the same reference reuses the pulled image"
        pulls=$(pulls_recorded)
        nx create --name "$NAME-2" "$IMAGE"
        now=$(pulls_recorded)
        [ "$now" = "$pulls" ] || { echo "::error::a second create from $IMAGE pulled again: Proxmox recorded $((now - pulls)) new ociregistrypull task(s)"; exit 1; }
        echo "[E2E] Proxmox recorded no new pull ($pulls before, $now after); the image on the storage was used"
        nx delete "$NAME-2"

        nx stop "$NAME"
        nx delete "$NAME"
        cleanup
        trap - EXIT
        echo "[E2E] registry path passed"

    - name: E2E through nexcage (templates - images, pull, rmi)
      # These three never met a real pvesh before: the simulator has fakes for
      # the storage endpoints, and nothing else exercised them. A storage
      # listing is exactly the kind of thing a fake gets subtly wrong.
      run: |
        set -euo pipefail
        LOG=e2e_templates.log
        : > "$LOG"
        exec > >(tee -a "$LOG") 2>&1
        export PATH=/usr/sbin:/sbin:/usr/bin:/bin:$PATH

        if [ "$(id -u)" -eq 0 ]; then SUDO=; else SUDO='sudo -n'; fi
        NEXCAGE="$PWD/zig-out/bin/nexcage"
        nx() { $SUDO "$NEXCAGE" "$@"; }
        HERE=$(hostname)

        vztmpl_list() { $SUDO pvesm list local --content vztmpl 2>/dev/null | awk 'NR>1 {print $1}' | sort; }
        before=$(vztmpl_list)
        cleanup() {
          set +e
          for vol in $(comm -13 <(echo "$before") <(vztmpl_list)); do
            echo "[E2E] freeing $vol"
            $SUDO pvesm free "$vol" >/dev/null 2>&1
          done
        }
        trap cleanup EXIT

        echo "[E2E] images lists what this node has, and agrees with pvesm"
        nx images | head -5
        for vol in $(vztmpl_list); do
          nx images | awk -F'\t' -v v="$vol" -v h="$HERE" '$5==v && $1==h && $2=="local" {f=1} END {exit !f}' \
            || { echo "::error::images does not list $vol on $HERE/local"; exit 1; }
        done

        echo "[E2E] a node the cluster does not have is an error, not an empty list"
        if nx images --node definitely-not-a-node >/dev/null 2>&1; then
          echo "::error::images accepted a node that does not exist"; exit 1
        fi

        read -r major minor <<<"$($SUDO pveversion | sed -n 's|^pve-manager/\([0-9]*\)\.\([0-9]*\).*|\1 \2|p')"
        if [ "${major:-0}" -lt 9 ] || { [ "${major:-0}" -eq 9 ] && [ "${minor:-0}" -lt 1 ]; }; then
          echo "::notice::Proxmox VE ${major:-?}.${minor:-?} cannot pull from a registry; images checked, pull and rmi skipped"
          exit 0
        fi

        echo "[E2E] pull, and the volid it prints is the one the storage holds"
        volid=$(nx pull docker.io/library/alpine:3.20)
        echo "[E2E] pulled $volid"
        vztmpl_list | grep -qxF "$volid" \
          || { echo "::error::pvesm does not have '$volid' after pull"; exit 1; }
        nx images | grep -qF "$volid" \
          || { echo "::error::images does not show '$volid' after pull"; exit 1; }

        echo "[E2E] rmi removes it from the storage, not just from the listing"
        nx rmi "$volid"
        vztmpl_list | grep -qxF "$volid" \
          && { echo "::error::'$volid' is still on the storage after rmi"; exit 1; }
        nx images | grep -qF "$volid" \
          && { echo "::error::images still shows '$volid' after rmi"; exit 1; }

        echo "[E2E] and removing it twice is an error, not a second success"
        if nx rmi "$volid" >/dev/null 2>&1; then
          echo "::error::rmi succeeded on a template that is gone"; exit 1
        fi

        cleanup
        trap - EXIT
        echo "[E2E] templates path passed"

    - name: Upload E2E logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: proxmox-e2e-logs
        # Every step's log, not just the first: the registry step has written
        # e2e_registry.log all along and it was never collected, so a failure
        # there left nothing to read afterwards.
        path: e2e_*.log
        retention-days: 7

    - name: Cleanup leftover E2E containers (always)
      if: always()
      run: |
        set -euo pipefail
        export PATH=/usr/sbin:/sbin:/usr/bin:/bin:$PATH
        if command -v sudo >/dev/null 2>&1; then SUDO='sudo -n'; else SUDO=; fi
        ALL_IDS=$($SUDO pct list 2>/dev/null | awk 'NR>1 {print $1}' || true)
        for id in $ALL_IDS; do
          name=$($SUDO pct config "$id" 2>/dev/null | awk -F': ' '/^hostname:/{print $2}')
          if [ -n "${name:-}" ] && [ "${name#gh-e2e-}" != "$name" ]; then
            echo "[E2E] Final cleanup vmid=$id ($name)"
            $SUDO pct shutdown "$id" --timeout 30 --forceStop 1 || true
            $SUDO pct stop "$id" || true
            for i in $(seq 1 10); do
              st=$($SUDO pct status "$id" 2>/dev/null || true)
              echo "$st" | grep -q running || break
              sleep 2
            done
            $SUDO pct destroy "$id" --purge 1 || true
          fi
        done
        # Bundles and packed templates a failed run can leave behind
        $SUDO find /var/lib/nexcage/bundles -maxdepth 1 -name 'gh-e2e-*' -exec rm -rf {} + 2>/dev/null || true
        for volid in $($SUDO pvesm list local --content vztmpl 2>/dev/null | awk '$1 ~ /:vztmpl\/nexcage-gh-e2e-/ {print $1}'); do
          echo "[E2E] Final cleanup template $volid"
          $SUDO rm -f "$($SUDO pvesm path "$volid")" || true
        done
