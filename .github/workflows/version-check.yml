name: Version Check

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  version:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Zig 0.15.1
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.15.1
          use-cache: false

      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y libcap-dev libseccomp-dev libjson-c-dev

      - name: Check Version
        run: bash scripts/ci/check_version.sh


