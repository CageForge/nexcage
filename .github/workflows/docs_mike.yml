name: Docs (mike versions)

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Version to deploy (e.g., v0.7.3)
        required: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    # mike pushes the built site to the gh-pages branch.
    permissions:
      contents: write
    steps:
      # The checkout keeps its credentials because `mike deploy --push` uses
      # them; the only code that runs after it is the hash-pinned tools below.
      - name: Checkout  # zizmor: ignore[artipacked]
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # Every package by version and hash; the hashes are for Python 3.12.
      - name: Install mkdocs + mike
        run: |
          pip install --require-hashes --only-binary :all: -r .github/requirements/docs.txt

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # A tag name may hold $, ( and `, so it reaches the shell as a
      # variable rather than as script text.
      - name: Determine version
        id: ver
        env:
          TAG: ${{ github.event.release.tag_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "release" ]; then
            echo "value=${TAG}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${INPUT_VERSION:-latest}" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy docs with mike
        env:
          VER: ${{ steps.ver.outputs.value }}
        run: |
          if [ "$VER" = "latest" ]; then
            mike deploy --push latest
          else
            mike deploy --push --update-aliases "$VER" latest
          fi
          mike set-default --push latest


