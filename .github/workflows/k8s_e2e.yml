name: Kubernetes pod on nexcage (self-hosted)

# tests/k8s/pod_on_node.sh on the E2E node (#312): k3s with nexcage as a
# runtime, and a pod with runtimeClassName: nexcage that has to be Ready, give
# its logs, run an exec and be deleted, and a pod under each of two isolation
# profiles. nexcage is the .deb built from the commit under test, as a release
# builds it (#380), installed on the node with apt. It was run by hand from
# 0.10.0 on.
#
# Not on every push: it installs k3s and removes it again, which takes a few
# minutes and changes the node the lifecycle E2E shares. It runs on release
# tags, on demand, and on a pull request that changes the test or the node
# configuration a release ships, which the test installs.

on:
  push:
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
    paths:
      - 'tests/k8s/**'
      - 'deploy/kubernetes/node/**'
      - 'packaging/config/config.oci.example.json'
      - 'scripts/build_deb_local.sh'
      - '.github/workflows/k8s_e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

# Never cancelled halfway: a cancelled run can leave k3s installed on the
# node. Grouped per ref, because a group keeps one pending run and cancels the
# one before it: with a single group, a dependabot pull request that touched
# this file cancelled another pull request's run. One at a time on the node is
# the single pve9 runner's doing.
concurrency:
  group: k8s-e2e-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build the .deb
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # As release.yml builds it: the Dockerfile brings the submodules and
      # libcrun's generated headers, -Dcpu=baseline keeps the binary from
      # dying with SIGILL on a node older than a GitHub runner, and the .deb
      # packs that binary.
      - name: Build
        run: |
          set -eux
          docker build \
            --build-arg BUILD_FLAGS="-Denable-backend-crun=true -Dcpu=baseline" \
            -t nexcage:k8s-e2e .
          cid=$(docker create nexcage:k8s-e2e)
          docker cp "$cid:/usr/local/bin/nexcage" nexcage.bin
          docker rm "$cid"
          NEXCAGE_BIN=nexcage.bin bash scripts/build_deb_local.sh

      - name: Upload
        uses: actions/upload-artifact@v6
        with:
          name: nexcage-deb-k8s-e2e
          path: dist/nexcage-*-amd64.deb
          retention-days: 3

  pod:
    name: A pod on nexcage through k3s
    needs: build
    # A pull request from a fork must not run code as root on the node: the
    # runner user there has sudo for everything.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, pve9]
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download the .deb
        uses: actions/download-artifact@v4
        with:
          name: nexcage-deb-k8s-e2e
          path: dist

      # The test installs the package, so a node that has nexcage installed
      # as a package already is left alone rather than overwritten.
      - name: The node has no nexcage package of its own
        id: precheck
        run: |
          if dpkg-query -W -f='${Status}' nexcage 2>/dev/null | grep -q 'install ok installed'; then
            echo "::error::nexcage is installed as a package on this node; the test would replace it"
            exit 1
          fi

      - name: Install the .deb
        id: install
        run: |
          set -eu
          if [ "$(id -u)" -eq 0 ]; then SUDO=; else SUDO='sudo -n'; fi
          $SUDO apt-get install -y ./dist/nexcage-*-amd64.deb
          nexcage version

      # The script needs root: it installs k3s, writes containerd's template
      # and restarts the service. It removes what it installed on the way out.
      - name: tests/k8s/pod_on_node.sh
        run: |
          set -eu
          if [ "$(id -u)" -eq 0 ]; then SUDO=; else SUDO='sudo -n'; fi
          $SUDO env NEXCAGE=/usr/bin/nexcage sh tests/k8s/pod_on_node.sh

      - name: Remove the .deb
        if: always() && steps.precheck.outcome == 'success' && steps.install.outcome != 'skipped'
        run: |
          if [ "$(id -u)" -eq 0 ]; then SUDO=; else SUDO='sudo -n'; fi
          $SUDO dpkg -r nexcage || true
