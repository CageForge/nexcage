name: Dependency Updates Check

# Files at most one open issue per dependency: before creating one, each job
# looks for an open issue with its labels and stops if it finds it. Without
# that the workflow filed a new copy every Monday.
#
# There is no Proxmox VE release check any more. It compared the latest PVE
# release with the first "N.N" grepped out of README/CHANGELOG/docs — which was
# nexcage's own version — and filed "Proxmox VE Release Available: 0.7 → 9.1"
# every week.
#
# There is no OCI Image Spec check any more either, for the same reason (#229).
# It took the first "vN.N.N" on any line matching "image-spec|Image Spec|OCI
# Image" in README/CHANGELOG/docs/deps, and the line it found was
# docs/releases/NOTES_v0.2.0.md — "Release v0.2.0 - OCI Image System" — so it
# reported nexcage's own v0.2.0 as the image-spec version in use and compared
# it with upstream's v1.1.1. nexcage declares no image-spec version anywhere,
# so there was nothing truthful for that check to read.

on:
  schedule:
    # Run weekly on Mondays at 09:00 UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:
    inputs:
      check_all:
        description: 'Check all dependencies (OCI, crun)'
        required: false
        default: 'true'
        type: boolean

jobs:
  check-oci-specs:
    name: Check OCI Specs Updates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check OCI Runtime Spec version
        id: oci_runtime
        run: |
          set -uo pipefail
          LATEST_RUNTIME=$(curl -sS https://api.github.com/repos/opencontainers/runtime-spec/releases/latest | jq -r '.tag_name // empty')

          # The version nexcage itself declares, which is the only runtime-spec
          # version the repository states anywhere: the ociVersion its `state`
          # output carries. This used to grep .github/ and deps/ for any
          # "vN.N.N" near the words "runtime-spec", which found nothing, so the
          # check never fired — and would have reported whatever unrelated
          # version appeared there first the day one did.
          CURRENT_RUNTIME=$(grep -rhoP '"ociVersion\\?": ?\\?"\K\d+\.\d+\.\d+' src/ 2>/dev/null | sort -u | head -1)
          [ -n "$CURRENT_RUNTIME" ] && CURRENT_RUNTIME="v$CURRENT_RUNTIME" || CURRENT_RUNTIME="unknown"

          echo "latest_runtime_spec=$LATEST_RUNTIME" >> $GITHUB_OUTPUT
          echo "current_runtime_spec=$CURRENT_RUNTIME" >> $GITHUB_OUTPUT

          if [ -n "$LATEST_RUNTIME" ] && [ "$CURRENT_RUNTIME" != "unknown" ] && [ "$LATEST_RUNTIME" != "$CURRENT_RUNTIME" ]; then
            echo "⚠️ nexcage reports ociVersion $CURRENT_RUNTIME; the runtime-spec is at $LATEST_RUNTIME"
            echo "update_available=true" >> $GITHUB_OUTPUT
          else
            echo "✅ ociVersion $CURRENT_RUNTIME, runtime-spec $LATEST_RUNTIME"
            echo "update_available=false" >> $GITHUB_OUTPUT
          fi

      - name: Create Issue for OCI Updates
        if: steps.oci_runtime.outputs.update_available == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const open = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'automated,oci',
              per_page: 100,
            });
            if (open.length > 0) {
              core.info(`#${open[0].number} already tracks OCI spec updates; not filing another`);
              return;
            }

            let body = '## OCI Runtime Spec\n\n';
            body += `nexcage reports \`"ociVersion": "${{ steps.oci_runtime.outputs.current_runtime_spec }}"\` in its \`state\` output; `;
            body += `the OCI runtime-spec is at ${{ steps.oci_runtime.outputs.latest_runtime_spec }}.\n\n`;
            body += `That is what the repository declares, not a guess: the number comes from the ociVersion nexcage emits. `;
            body += `Raising it is a claim about conformance, so it is a decision rather than a bump — this issue only reports the difference.\n\n`;
            body += `Filed by the Dependency Updates Check workflow.`;

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[Dependency] nexcage reports ociVersion ${{ steps.oci_runtime.outputs.current_runtime_spec }}, runtime-spec is ${{ steps.oci_runtime.outputs.latest_runtime_spec }}`,
              body: body,
              labels: ['dependencies', 'oci', 'automated']
            });

  check-crun:
    name: Check crun Updates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Get crun version from deps
        id: current_crun
        run: |
          if [ -d "deps/crun" ]; then
            cd deps/crun
            # Check if it's a git repository
            if [ -d ".git" ]; then
              # Try to get tag, if not available use commit hash
              if CURRENT_TAG=$(git describe --tags --exact-match HEAD 2>/dev/null); then
                CURRENT_VERSION="$CURRENT_TAG"
              elif CURRENT_TAG=$(git describe --tags --abbrev=0 2>/dev/null); then
                CURRENT_VERSION="$CURRENT_TAG"
              else
                CURRENT_VERSION=$(git rev-parse --short HEAD 2>/dev/null || echo "unknown")
              fi
            else
              # Not a git repo, try to find version in files (VERSION, Makefile, etc.)
              CURRENT_VERSION=$(grep -rE "VERSION|version" Makefile.am configure.ac NEWS 2>/dev/null | \
                grep -oP '\d+\.\d+\.\d+' | head -1 || \
                echo "unknown")
            fi
            echo "current_version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
            cd ../..
          else
            echo "current_version=unknown" >> $GITHUB_OUTPUT
          fi

      - name: Check latest crun release
        id: latest_crun
        run: |
          LATEST_VERSION=$(curl -s https://api.github.com/repos/containers/crun/releases/latest | jq -r '.tag_name')
          echo "latest_version=$LATEST_VERSION" >> $GITHUB_OUTPUT

          CURRENT="${{ steps.current_crun.outputs.current_version }}"

          if [ "$LATEST_VERSION" != "$CURRENT" ] && [ "$CURRENT" != "unknown" ]; then
            echo "⚠️ crun update available: $CURRENT → $LATEST_VERSION"
            echo "update_available=true" >> $GITHUB_OUTPUT
          else
            echo "✅ crun is up to date"
            echo "update_available=false" >> $GITHUB_OUTPUT
          fi

      - name: Create Issue for crun Update
        if: steps.latest_crun.outputs.update_available == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const open = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'automated,crun',
              per_page: 100,
            });
            if (open.length > 0) {
              core.info(`#${open[0].number} already tracks crun updates; not filing another`);
              return;
            }

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[Dependency] crun Update Available: ${{ steps.current_crun.outputs.current_version }} → ${{ steps.latest_crun.outputs.latest_version }}`,
              body: `## crun Library Update Available\n\n` +
                    `- **Current Version**: ${{ steps.current_crun.outputs.current_version }}\n` +
                    `- **Latest Version**: ${{ steps.latest_crun.outputs.latest_version }}\n\n` +
                    `This issue was automatically created by the Dependency Updates Check workflow.\n` +
                    `Please review and update crun if needed.\n\n` +
                    `Release: https://github.com/containers/crun/releases/tag/${{ steps.latest_crun.outputs.latest_version }}`,
              labels: ['dependencies', 'crun', 'automated']
            });

  summary:
    name: Dependency Check Summary
    runs-on: ubuntu-latest
    needs: [check-oci-specs, check-crun]
    if: always()
    steps:
      - name: Check Summary
        run: |
          echo "## Dependency Check Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ All dependency checks completed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Check individual jobs for detailed results." >> $GITHUB_STEP_SUMMARY
