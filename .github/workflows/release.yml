name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to build (e.g., v0.8.0)'
        required: true
        type: string

permissions:
  contents: write

# Both builds run on GitHub-hosted runners: neither needs a Proxmox host, and
# the self-hosted runner's workspace held a root-owned .cache that made every
# checkout there fail. The .deb is assembled by scripts/build_deb_local.sh; the
# dh-based packaging it replaces could not build (no debian/ at the root, a
# Build-Depends on a zig package that does not exist, dh-systemd, which Ubuntu
# no longer ships).

jobs:
  build:
    name: Build Release Binary
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      version: ${{ steps.get_version.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.version || github.ref }}

      - name: Setup Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.15.1

      - name: Extract version from tag
        id: get_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          VERSION="${VERSION#v}"
          FILE_VERSION=$(tr -d '\n\r' < VERSION)
          if [ "$VERSION" != "$FILE_VERSION" ]; then
            echo "::error::tag v$VERSION does not match the VERSION file ($FILE_VERSION)"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Test
        run: zig build test --summary all

      - name: Build
        run: zig build -Doptimize=ReleaseSafe

      - name: Create artifact
        id: build
        run: |
          mkdir -p dist
          BIN_NAME=nexcage-${{ steps.get_version.outputs.version }}-amd64
          cp zig-out/bin/nexcage "dist/${BIN_NAME}"
          chmod +x "dist/${BIN_NAME}"
          "dist/${BIN_NAME}" version

          SHA256=$(sha256sum "dist/${BIN_NAME}" | cut -d' ' -f1)
          echo "sha256=${SHA256}" >> "$GITHUB_OUTPUT"
          echo "artifact_path=dist/${BIN_NAME}" >> "$GITHUB_OUTPUT"

      - name: Generate SBOM (SPDX JSON)
        uses: anchore/sbom-action@v0
        with:
          path: dist
          artifact-name: nexcage-${{ steps.get_version.outputs.version }}-amd64.sbom
          output-file: dist/nexcage-${{ steps.get_version.outputs.version }}-amd64.sbom.spdx.json
          format: spdx-json

      - name: Generate SBOM (CycloneDX JSON)
        run: |
          cat > dist/nexcage-${{ steps.get_version.outputs.version }}-amd64.sbom.cdx.json << EOF
          {
            "bomFormat": "CycloneDX",
            "specVersion": "1.4",
            "version": 1,
            "metadata": {
              "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
              "component": {
                "type": "application",
                "name": "nexcage",
                "version": "${{ steps.get_version.outputs.version }}"
              }
            },
            "components": []
          }
          EOF

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: nexcage-${{ steps.get_version.outputs.version }}-amd64
          path: dist/nexcage-${{ steps.get_version.outputs.version }}-amd64

      - name: Upload SBOMs
        uses: actions/upload-artifact@v4
        with:
          name: nexcage-${{ steps.get_version.outputs.version }}-amd64.sbom
          path: |
            dist/nexcage-${{ steps.get_version.outputs.version }}-amd64.sbom.spdx.json
            dist/nexcage-${{ steps.get_version.outputs.version }}-amd64.sbom.cdx.json

      - name: Generate SLSA provenance (basic)
        run: |
          cat > dist/provenance.json << EOF
          {
            "_type": "https://in-toto.io/Statement/v1",
            "subject": [
              {
                "name": "${{ steps.build.outputs.artifact_path }}",
                "digest": { "sha256": "${{ steps.build.outputs.sha256 }}" }
              }
            ],
            "predicateType": "https://slsa.dev/provenance/v1",
            "predicate": {
              "buildDefinition": {
                "buildType": "https://github.com/actions/v1",
                "externalParameters": {
                  "workflow": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                }
              }
            }
          }
          EOF

      - name: Upload provenance
        uses: actions/upload-artifact@v4
        with:
          name: nexcage-${{ steps.get_version.outputs.version }}-amd64.provenance
          path: dist/provenance.json

  build-deb:
    name: Build .deb (amd64)
    runs-on: ubuntu-24.04
    needs: build
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.version || github.ref }}

      - name: Setup Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.15.1

      - name: Build package
        run: bash scripts/build_deb_local.sh

      - name: Install and run it
        run: |
          DEB=dist/nexcage-${{ needs.build.outputs.version }}-amd64.deb
          dpkg-deb --info "$DEB"
          sudo apt-get install -y "./$DEB"
          nexcage version
          nexcage --help > /dev/null
          man -w nexcage

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: nexcage-${{ needs.build.outputs.version }}-amd64.deb
          path: dist/*.deb

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build, build-deb]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.version || github.ref }}

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release
          find artifacts -type f -exec cp {} release/ \;
          ls -la release/

      - name: Create checksums
        run: |
          cd release
          sha256sum * > checksums.txt
          cat checksums.txt

      - name: Check release notes exist
        run: |
          NOTES=docs/releases/NOTES_v${{ needs.build.outputs.version }}.md
          if [ ! -f "$NOTES" ]; then
            echo "::error::$NOTES is missing"
            exit 1
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build.outputs.version }}
          files: release/*
          body_path: docs/releases/NOTES_v${{ needs.build.outputs.version }}.md
          draft: false
          prerelease: false
