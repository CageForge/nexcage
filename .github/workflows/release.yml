name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to build (e.g., v0.9.0)'
        required: true
        type: string

# Read-only unless a job says otherwise: only the release job, which
# publishes, writes. Every job used to hold contents: write, including the one
# that runs a third-party action between building the binary and uploading it.
permissions:
  contents: read

# A release carries one binary with both backends, Proxmox LXC and crun, and
# one .deb that packs that same binary (#380). The binary is built through the
# Dockerfile, which brings libcrun's submodules and generated headers.
#
# The builds run on GitHub-hosted runners: none needs a Proxmox host, and
# the self-hosted runner's workspace held a root-owned .cache that made every
# checkout there fail. The .deb is assembled by scripts/build_deb_local.sh; the
# dh-based packaging it replaces could not build (no debian/ at the root, a
# Build-Depends on a zig package that does not exist, dh-systemd, which Ubuntu
# no longer ships).

jobs:
  build:
    name: Test, and check the tag against VERSION
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      version: ${{ steps.get_version.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.version || github.ref }}
          persist-credentials: false

      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.15.1
          # A release is built from nothing but the tagged tree.
          use-cache: false

      # The binary job builds through the Dockerfile, which clones crun by a
      # hash of its own: it has to be the commit deps/crun pins.
      - name: The Dockerfile builds the crun deps/crun pins
        run: sh scripts/ci/check_crun_pin.sh

      - name: Extract version from tag
        id: get_version
        # The input reaches the shell as a variable, never as script text.
        # Every later use of the version is this output, which has to equal
        # the VERSION file of the tree being built.
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          VERSION="${VERSION#v}"
          FILE_VERSION=$(tr -d '\n\r' < VERSION)
          if [ "$VERSION" != "$FILE_VERSION" ]; then
            echo "::error::tag v$VERSION does not match the VERSION file ($FILE_VERSION)"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Test
        run: zig build test --summary all

  binary:
    name: The binary, with both backends (amd64)
    runs-on: ubuntu-24.04
    needs: build
    timeout-minutes: 60
    # It attests the binary it built: a signed statement, kept by GitHub, that
    # this file came from this workflow at this commit, which a user checks
    # with `gh attestation verify`. checksums.txt cannot do that: it is
    # published by the same job as the files it lists. The token that signs
    # is why nothing third-party runs in this job; the SBOMs are made in a
    # job of their own.
    permissions:
      contents: read
      id-token: write
      attestations: write
    # The binary's sha256 as this job measured it. A job output cannot be
    # changed by a later job, as a stored artifact can; build-deb and release
    # check the file they are given against it.
    outputs:
      sha256: ${{ steps.build.outputs.sha256 }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.version || github.ref }}
          persist-credentials: false

      # The crun backend links vendored libcrun, which needs the submodules and
      # two generated header sets. The Dockerfile does all of that from a clean
      # clone, which is why this goes through Docker rather than `zig build`.
      # -Dcpu=baseline, not the runner's CPU: without it Zig tunes the binary
      # for whatever the GitHub runner happens to be, and it dies with SIGILL on
      # an older host -- a Xeon E5 v2, say, which is ordinary hardware for a
      # Proxmox node.
      # Retried on Docker Hub's 429 Too Many Requests, and on nothing else.
      - name: Build the image
        run: |
          sh scripts/ci/retry_on_429.sh docker build \
            --build-arg BUILD_FLAGS="-Denable-backend-crun=true -Dcpu=baseline" \
            -t nexcage:release .

      - name: It runs, and the crun backend is really in it
        # Checked inside the image, where the shared libraries are. `features`
        # is answered by libcrun itself, so it cannot succeed on a binary that
        # was built without the backend -- as long as its exit status is
        # looked at: this used to be `features | head -3`, whose status is
        # head's. A failure here stops the release before anything is
        # published.
        run: |
          set -eux
          docker run --rm nexcage:release version
          docker run --rm nexcage:release --runtime crun features > features.json
          python3 tests/crun/features_check.py features.json

      - name: Extract the binary
        id: build
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -eux
          mkdir -p dist
          BIN_NAME=nexcage-${VERSION}-amd64
          cid=$(docker create nexcage:release)
          docker cp "$cid:/usr/local/bin/nexcage" "dist/${BIN_NAME}"
          docker rm "$cid"
          chmod +x "dist/${BIN_NAME}"
          file "dist/${BIN_NAME}"
          # What a host has to have for it to start: libcrun's dependencies,
          # which the .deb's Depends pulls and a bare download has to install.
          docker run --rm --entrypoint /bin/sh nexcage:release \
            -c 'ldd /usr/local/bin/nexcage' || true
          SHA256=$(sha256sum "dist/${BIN_NAME}" | cut -d' ' -f1)
          echo "sha256=${SHA256}" >> "$GITHUB_OUTPUT"
          echo "artifact_path=dist/${BIN_NAME}" >> "$GITHUB_OUTPUT"

      - name: Attest the binary
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/nexcage-${{ needs.build.outputs.version }}-amd64

      - name: Upload the binary
        uses: actions/upload-artifact@v6
        with:
          name: nexcage-${{ needs.build.outputs.version }}-amd64
          path: dist/nexcage-${{ needs.build.outputs.version }}-amd64

      - name: Generate SLSA provenance (basic)
        env:
          ARTIFACT_PATH: ${{ steps.build.outputs.artifact_path }}
          SHA256: ${{ steps.build.outputs.sha256 }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          cat > dist/provenance.json << EOF
          {
            "_type": "https://in-toto.io/Statement/v1",
            "subject": [
              {
                "name": "${ARTIFACT_PATH}",
                "digest": { "sha256": "${SHA256}" }
              }
            ],
            "predicateType": "https://slsa.dev/provenance/v1",
            "predicate": {
              "buildDefinition": {
                "buildType": "https://github.com/actions/v1",
                "externalParameters": {
                  "workflow": "${RUN_URL}"
                }
              }
            }
          }
          EOF

      - name: Upload provenance
        uses: actions/upload-artifact@v6
        with:
          name: nexcage-${{ needs.build.outputs.version }}-amd64.provenance
          path: dist/provenance.json

  # The SBOMs, from the binary the binary job uploaded. anchore/sbom-action
  # also downloads and runs syft; here it has a read-only token and nothing
  # to sign with. It still holds the run's artifact token, with which it could
  # delete the stored binary or .deb and upload another file under any name,
  # so build-deb and release check every file they take from the store
  # against the sha256 the job that built it recorded.
  sbom:
    name: SBOMs of the binary
    runs-on: ubuntu-24.04
    needs: [build, binary]
    timeout-minutes: 15

    steps:
      - name: The binary the release publishes
        uses: actions/download-artifact@v7
        with:
          name: nexcage-${{ needs.build.outputs.version }}-amd64
          path: dist

      - name: Generate SBOM (SPDX JSON)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: dist
          output-file: dist/nexcage-${{ needs.build.outputs.version }}-amd64.sbom.spdx.json
          format: spdx-json
          # "Upload SBOMs" below uploads both SBOMs under one artifact name.
          # Letting this action upload as well made the v0.8.0 run fail with
          # 409 "an artifact with this name already exists".
          upload-artifact: false
          upload-release-assets: false

      - name: Generate SBOM (CycloneDX JSON)
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          cat > "dist/nexcage-${VERSION}-amd64.sbom.cdx.json" << EOF
          {
            "bomFormat": "CycloneDX",
            "specVersion": "1.4",
            "version": 1,
            "metadata": {
              "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
              "component": {
                "type": "application",
                "name": "nexcage",
                "version": "${VERSION}"
              }
            },
            "components": []
          }
          EOF

      - name: Upload SBOMs
        uses: actions/upload-artifact@v6
        with:
          name: nexcage-${{ needs.build.outputs.version }}-amd64.sbom
          path: |
            dist/nexcage-${{ needs.build.outputs.version }}-amd64.sbom.spdx.json
            dist/nexcage-${{ needs.build.outputs.version }}-amd64.sbom.cdx.json

  build-deb:
    name: Build .deb (amd64)
    runs-on: ubuntu-24.04
    needs: [build, binary]
    timeout-minutes: 30
    # Attests the package once it has installed and run on Debian 13.
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      sha256: ${{ steps.deb.outputs.sha256 }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.version || github.ref }}
          persist-credentials: false

      - name: The binary the release publishes
        uses: actions/download-artifact@v7
        with:
          name: nexcage-${{ needs.build.outputs.version }}-amd64
          path: bin

      # The .deb packs, and this job attests, only the file the binary job
      # built: the sbom job, running in parallel, can replace the stored one.
      - name: It is the binary the binary job built
        env:
          VERSION: ${{ needs.build.outputs.version }}
          SHA256: ${{ needs.binary.outputs.sha256 }}
        run: printf '%s  %s\n' "$SHA256" "bin/nexcage-${VERSION}-amd64" | sha256sum --strict -c -

      - name: Build package
        # The .deb packs that same binary: one release, one binary.
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: NEXCAGE_BIN="bin/nexcage-${VERSION}-amd64" bash scripts/build_deb_local.sh

      - name: Install it on Debian 13, as a Proxmox VE 9 node is, and run it
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: sh scripts/ci/check_deb.sh "dist/nexcage-${VERSION}-amd64.deb"

      - name: Record the .deb's sha256
        id: deb
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          sum=$(sha256sum "dist/nexcage-${VERSION}-amd64.deb" | cut -d' ' -f1)
          echo "sha256=${sum}" >> "$GITHUB_OUTPUT"

      - name: Attest the .deb
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/nexcage-${{ needs.build.outputs.version }}-amd64.deb

      - name: Upload .deb
        uses: actions/upload-artifact@v6
        with:
          name: nexcage-${{ needs.build.outputs.version }}-amd64.deb
          path: dist/*.deb

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build, binary, sbom, build-deb]
    # The one job that writes: it publishes the release and its assets.
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.version || github.ref }}
          persist-credentials: false

      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release
          find artifacts -type f -exec cp {} release/ \;
          ls -la release/

      # Every artifact of the run is downloaded, and the sbom job could have
      # replaced one or added its own (see that job). checksums.txt, made
      # next, would vouch for whatever is here. So the binary and the .deb
      # have to have the sha256 their own jobs recorded, and nothing else may
      # be published.
      - name: The assets are the files this workflow built
        env:
          VERSION: ${{ needs.build.outputs.version }}
          BIN_SHA256: ${{ needs.binary.outputs.sha256 }}
          DEB_SHA256: ${{ needs.build-deb.outputs.sha256 }}
        run: |
          set -euo pipefail
          cd release
          printf '%s  %s\n' "$BIN_SHA256" "nexcage-${VERSION}-amd64" \
            "$DEB_SHA256" "nexcage-${VERSION}-amd64.deb" | sha256sum --strict -c -
          expected=$(printf '%s\n' "nexcage-${VERSION}-amd64" "nexcage-${VERSION}-amd64.deb" \
            "nexcage-${VERSION}-amd64.sbom.cdx.json" "nexcage-${VERSION}-amd64.sbom.spdx.json" \
            provenance.json | LC_ALL=C sort)
          actual=$(ls -A | LC_ALL=C sort)
          if [ "$actual" != "$expected" ]; then
            echo "::error::the release assets are not the files this workflow builds"
            diff <(echo "$expected") <(echo "$actual") || true
            exit 1
          fi

      - name: Create checksums
        run: |
          cd release
          sha256sum * > checksums.txt
          cat checksums.txt

      - name: Check release notes exist
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          NOTES="docs/releases/NOTES_v${VERSION}.md"
          if [ ! -f "$NOTES" ]; then
            echo "::error::$NOTES is missing"
            exit 1
          fi
          # The notes become the release page, where a link relative to
          # docs/releases/ points nowhere.
          if grep -nE '\]\((\.\./|\./)?[A-Za-z0-9_./-]+\.md(#[^)]*)?\)' "$NOTES"; then
            echo "::error::$NOTES links a file by a relative path; link it on github.com instead"
            exit 1
          fi

      # Pinned to a commit: a tag can be moved, and this step holds the token
      # that writes releases. `gh release create` could do the same, as
      # zizmor's superfluous-actions says; swapping it is a change of its own.
      - name: Create Release  # zizmor: ignore[superfluous-actions]
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: v${{ needs.build.outputs.version }}
          files: release/*
          body_path: docs/releases/NOTES_v${{ needs.build.outputs.version }}.md
          draft: false
          prerelease: false
