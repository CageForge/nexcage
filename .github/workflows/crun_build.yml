name: crun backend build

# The crun backend is opt-in and links vendored libcrun, which needs the
# submodules plus two generated header sets. The Dockerfile does all of that
# from a clean clone (#238), so CI builds through it rather than repeating the
# steps. Pull requests run it only when they touch what it depends on.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    paths:
      - 'build.zig'
      - 'build.zig.zon'
      - 'Dockerfile'
      - '.dockerignore'
      - 'src/backends/crun/**'
      - 'scripts/gen_crun_headers_local.sh'
      - '.github/workflows/crun_build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crun-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    name: Docker build (crun + vendored libcrun)
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build --build-arg BUILD_FLAGS=-Denable-backend-crun=true -t nexcage:ci .

      - name: Run the binary
        run: docker run --rm nexcage:ci version
