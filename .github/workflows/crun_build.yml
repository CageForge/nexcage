name: crun backend build

# The crun backend is opt-in and links vendored libcrun, which needs the
# submodules plus two generated header sets. The Dockerfile does all of that
# from a clean clone (#238), so CI builds through it rather than repeating the
# steps.
#
# This used to run on a pull request only when it touched build.zig, the
# Dockerfile or src/backends/crun/. That cannot express what actually pulls the
# backend into a compilation: Zig analyses what is reachable, so a change to
# the router that starts calling a crun function compiles code nothing compiled
# before. #260 did exactly that, the job did not run on the pull request, and
# main was left broken until the push-triggered run failed unnoticed.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crun-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    name: Docker build (crun + vendored libcrun)
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build --build-arg BUILD_FLAGS=-Denable-backend-crun=true -t nexcage:ci .

      - name: Run the binary
        run: docker run --rm nexcage:ci version
