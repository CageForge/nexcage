name: crun backend build

# The crun backend is opt-in and links vendored libcrun, which needs the
# submodules plus two generated header sets. The Dockerfile does all of that
# from a clean clone (#238), so CI builds through it rather than repeating the
# steps.
#
# This used to run on a pull request only when it touched build.zig, the
# Dockerfile or src/backends/crun/. That cannot express what actually pulls the
# backend into a compilation: Zig analyses what is reachable, so a change to
# the router that starts calling a crun function compiles code nothing compiled
# before. #260 did exactly that, the job did not run on the pull request, and
# main was left broken until the push-triggered run failed unnoticed.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crun-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    name: Docker build (crun + vendored libcrun)
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build --build-arg BUILD_FLAGS=-Denable-backend-crun=true -t nexcage:ci .

      - name: Run the binary
        run: docker run --rm nexcage:ci version

      # The features document is read through a hand-written Zig mirror of two
      # crun structs, and the vendored crun is a fork that moves -- it already
      # carries a field upstream does not. A wrong layout compiles fine and
      # then segfaults, or produces plausible rubbish. The check runs in the
      # builder stage because that is where deps/crun is checked out; the
      # production image does not carry the header.
      # .dockerignore excludes scripts/ (all but one file), so the check comes
      # in from the checkout rather than out of the image.
      - name: The features ABI still matches the vendored header
        run: |
          set -eux
          docker build --target builder -t nexcage:builder .
          docker run --rm -v "$PWD/scripts:/s:ro" nexcage:builder \
            sh /s/check_features_abi.sh

      # containerd's CRI asks for this once at startup. The values must be
      # libcrun's own, read from this build -- a features document written by
      # hand would be a set of promises to a kubelet about someone else's
      # compile-time configuration, free to drift from it silently.
      - name: The features document comes from this build's libcrun
        run: |
          set -eux
          docker run --rm nexcage:ci --runtime crun features > features.json
          python3 - <<'PY'
          import json
          d = json.load(open("features.json"))
          assert d["ociVersionMin"].startswith("1."), d["ociVersionMin"]
          assert "createRuntime" in d["hooks"], d["hooks"]
          assert "mount" in d["linux"]["namespaces"], d["linux"]["namespaces"]
          assert "bind" in d["mountOptions"], d["mountOptions"][:10]
          assert d["linux"]["cgroup"]["v2"] is True, d["linux"]["cgroup"]
          assert d["annotations"]["run.oci.crun.version"], d["annotations"]
          assert d["annotations"]["io.cageforge.nexcage.backend"] == "crun"
          print("spec", d["ociVersionMin"], "to", d["ociVersionMax"],
                "on crun", d["annotations"]["run.oci.crun.version"])
          PY

      # A container engine does not run the runtime from the bundle it names:
      # containerd's shim serves a whole pod and runs it from the sandbox's
      # directory. Nothing before this exercised that, and the backend had
      # never entered the bundle, so a pod's container looked for its rootfs
      # inside the sandbox's. `version` cannot see that; a container can.
      - name: A bundle is found from a working directory that is not it
        run: |
          set -eux
          mkdir -p bundle/rootfs
          docker create --name bbsrc busybox:1.36 >/dev/null
          docker export bbsrc | tar -x -C bundle/rootfs
          docker rm bbsrc >/dev/null
          docker run --rm --privileged --cgroupns=private \
            -v "$PWD/bundle:/bundle" -v "$PWD/tests/crun:/t:ro" \
            --entrypoint /bin/sh nexcage:ci /t/foreign_cwd.sh
