name: crun backend build

# The crun backend is opt-in and links vendored libcrun, which needs the
# submodules plus two generated header sets. The Dockerfile does all of that
# from a clean clone (#238), so CI builds through it rather than repeating the
# steps.
#
# This used to run on a pull request only when it touched build.zig, the
# Dockerfile or src/backends/crun/. That cannot express what actually pulls the
# backend into a compilation: Zig analyses what is reachable, so a change to
# the router that starts calling a crun function compiles code nothing compiled
# before. #260 did exactly that, the job did not run on the pull request, and
# main was left broken until the push-triggered run failed unnoticed.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crun-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    name: Docker build (crun + vendored libcrun)
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build image
        run: docker build --build-arg BUILD_FLAGS=-Denable-backend-crun=true -t nexcage:ci .

      - name: Run the binary
        run: docker run --rm nexcage:ci version

      # A release packs this binary into the .deb (#380). The .deb is built
      # and installed on Debian 13 here, on every pull request, so that a
      # packaging mistake shows before a tag does: the Depends line has to
      # bring in what the binary links, and the crun backend has to answer.
      - name: The .deb packs it and installs on Debian 13
        run: |
          set -eux
          cid=$(docker create nexcage:ci)
          docker cp "$cid:/usr/local/bin/nexcage" nexcage.bin
          docker rm "$cid"
          NEXCAGE_BIN=nexcage.bin bash scripts/build_deb_local.sh
          sh scripts/ci/check_deb.sh "dist/nexcage-$(cat VERSION)-amd64.deb"
          rm -rf dist nexcage.bin

      # The features document is read through a hand-written Zig mirror of two
      # crun structs, and the vendored crun is a fork that moves -- it already
      # carries a field upstream does not. A wrong layout compiles fine and
      # then segfaults, or produces plausible rubbish. The check runs in the
      # builder stage because that is where deps/crun is checked out; the
      # production image does not carry the header.
      # .dockerignore excludes scripts/ (all but one file), so the check comes
      # in from the checkout rather than out of the image.
      - name: The features ABI still matches the vendored header
        run: |
          set -eux
          docker build --target builder -t nexcage:builder .
          docker run --rm -v "$PWD/scripts:/s:ro" nexcage:builder \
            sh /s/check_features_abi.sh

      # containerd's CRI asks for this once at startup. The values must be
      # libcrun's own, read from this build -- a features document written by
      # hand would be a set of promises to a kubelet about someone else's
      # compile-time configuration, free to drift from it silently. The check
      # is a file so that `scripts/dev.sh crun` runs the same one.
      - name: The features document comes from this build's libcrun
        run: |
          set -eux
          docker run --rm nexcage:ci --runtime crun features > features.json
          python3 tests/crun/features_check.py features.json

      # Kubernetes asks for `ps --format json` and used to get `unknown
      # command`. containerd says nothing about that in its journal and the pod
      # runs anyway, so the only thing that showed it was recording the command
      # lines. The check compares against crun: a list of live PIDs proves
      # nothing on its own.
      - name: ps reports the container's processes, and crun agrees
        run: |
          set -eux
          mkdir -p bundle/rootfs
          docker create --name bbps busybox:1.36 >/dev/null
          docker export bbps | tar -x -C bundle/rootfs
          docker rm bbps >/dev/null
          docker run --rm --privileged --cgroupns=private \
            -v "$PWD/bundle:/bundle" -v "$PWD/tests/crun:/t:ro" \
            --entrypoint /bin/sh nexcage:ci /t/ps.sh

      # update's value flags are nexcage's own: each one is mapped to crun's
      # section and field and handed to libcrun_container_update_from_values
      # (#359). An engine's resize takes --resources, which the pod step below
      # covers. The check reads the container's cgroup after each update.
      - name: update's flags reach the container's cgroup
        run: |
          set -eux
          mkdir -p bundle/rootfs
          docker create --name bbupd busybox:1.36 >/dev/null
          docker export bbupd | tar -x -C bundle/rootfs
          docker rm bbupd >/dev/null
          docker run --rm --privileged --cgroupns=private \
            -v "$PWD/bundle:/bundle" -v "$PWD/tests/crun:/t:ro" \
            --entrypoint /bin/sh nexcage:ci /t/update.sh

      # An isolation profile narrows the bundle create hands libcrun (#315,
      # ADR-005). The check names the profile by the program name, as an
      # engine's BinaryName does, and reads the result from the container's
      # /proc status and cgroup, not from nexcage.
      - name: an isolation profile narrows the container
        run: |
          set -eux
          mkdir -p bundle/rootfs
          docker create --name bbprof busybox:1.36 >/dev/null
          docker export bbprof | tar -x -C bundle/rootfs
          docker rm bbprof >/dev/null
          docker run --rm --privileged --cgroupns=private \
            -v "$PWD/bundle:/bundle" -v "$PWD/tests/crun:/t:ro" \
            --entrypoint /bin/sh nexcage:ci /t/profile.sh

      # The checks around this one are unit-sized. This is the interface a
      # kubelet drives: a pod sandbox and a container in it, through
      # containerd's CRI with nexcage as the runtime handler, on a CNI bridge.
      # Three engine-facing defects in a row were invisible to everything here
      # because nothing ran an engine.
      - name: A pod runs on nexcage through containerd's CRI
        run: |
          set -eux
          docker build -f tests/cri/Dockerfile -t nexcage:cri-test tests/cri
          docker run --rm --privileged --cgroupns=private \
            -v "$PWD/tests/cri:/t:ro" nexcage:cri-test /t/pod_on_nexcage.sh

      # The runtime-spec's own validation suite (#310), opencontainers/
      # runtime-tools, against this build routed to crun, with the image's crun
      # alongside for reference. It asks what the specification says, not only
      # what one engine happened to ask. The step fails on a failure
      # tests/runtime-tools/known-failures does not name, and on a named one
      # that passes.
      - name: The runtime-spec validation suite
        run: |
          set -eux
          docker build -f tests/runtime-tools/Dockerfile -t nexcage:runtime-tools tests/runtime-tools
          docker run --rm --privileged --cgroupns=private \
            -v "$PWD/tests/runtime-tools:/t:ro" nexcage:runtime-tools /t/run.sh

      # A container engine does not run the runtime from the bundle it names:
      # containerd's shim serves a whole pod and runs it from the sandbox's
      # directory. Nothing before this exercised that, and the backend had
      # never entered the bundle, so a pod's container looked for its rootfs
      # inside the sandbox's. `version` cannot see that; a container can.
      - name: A bundle is found from a working directory that is not it
        run: |
          set -eux
          mkdir -p bundle/rootfs
          docker create --name bbsrc busybox:1.36 >/dev/null
          docker export bbsrc | tar -x -C bundle/rootfs
          docker rm bbsrc >/dev/null
          docker run --rm --privileged --cgroupns=private \
            -v "$PWD/bundle:/bundle" -v "$PWD/tests/crun:/t:ro" \
            --entrypoint /bin/sh nexcage:ci /t/foreign_cwd.sh

      # critest (#311), the CRI validation suite from cri-tools: what
      # Kubernetes checks of a runtime, through the same containerd and the
      # image the pod step built. It runs last: it takes the longest, and a
      # failure here should not hide the checks above. The step fails on a
      # failure tests/cri/critest-known-failures does not name, and on a named
      # one that does not fail.
      - name: critest, the CRI validation suite
        run: |
          set -eux
          docker run --rm --privileged --cgroupns=private \
            -v "$PWD/tests/cri:/t:ro" nexcage:cri-test /t/critest.sh
