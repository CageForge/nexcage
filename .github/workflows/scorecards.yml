name: OpenSSF Scorecards

on:
  branch_protection_rule:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 2 * * 1' # Every Monday at 2 AM UTC
  workflow_dispatch:

# Read-only at the top, as scorecard-action's workflow check asks (its API
# rejects results from a workflow with any write permission at this level).
# read-all, as in the action's own example, writes nothing, and the job's
# block below replaces it with exactly what publishing its results needs;
# zizmor's auditor persona flags it all the same.
permissions: read-all

jobs:
  analysis:
    name: OpenSSF Scorecards Analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
          # Enable all checks for comprehensive security analysis
          checks: all

      - name: Upload results
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: results.sarif

