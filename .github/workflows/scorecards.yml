name: OpenSSF Scorecards

on:
  branch_protection_rule:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 2 * * 1' # Every Monday at 2 AM UTC
  workflow_dispatch:

# Read-only at the top, as scorecard-action's workflow check asks (its API
# rejects results from a workflow with any write permission at this level).
# read-all, as in the action's own example, writes nothing, and the job's
# block below replaces it with exactly what publishing its results needs;
# zizmor's auditor persona flags it all the same.
permissions: read-all

jobs:
  analysis:
    name: OpenSSF Scorecards Analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
          # Enable all checks for comprehensive security analysis
          checks: all

      - name: Upload results
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: results.sarif

