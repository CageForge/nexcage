name: Probe - which auth file a registry pull reads (#309)

# A one-off probe, not a test: it answers #309's open question on the E2E node
# and is removed again in the same pull request.
#
# Proxmox's oci-registry-pull runs `skopeo copy` with no --authfile. Which
# file does that skopeo read: when nexcage calls pvesh on the node, and when
# the pull goes through pvedaemon, as `--node` does? A file with wrong
# credentials for docker.io answers it without a private registry or a secret:
# an anonymous pull of a public image works, and fails with "unauthorized" as
# soon as skopeo sends the wrong credentials it found.

on:
  pull_request:
    branches: [ main ]
    paths: [ '.github/workflows/probe_registry_auth.yml' ]

permissions:
  contents: read

jobs:
  probe:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, pve9]
    timeout-minutes: 20
    steps:
      - name: Which auth file a registry pull reads
        run: |
          # Failures are the answer here, not a reason to stop.
          set +e -u
          export PATH=/usr/sbin:/sbin:/usr/bin:/bin:$PATH
          if [ "$(id -u)" -eq 0 ]; then SUDO=; else SUDO='sudo -n'; fi
          NODE=$(hostname)
          IMG=docker.io/library/busybox:1.36
          CANDIDATES="/root/.config/containers/auth.json /run/containers/0/auth.json /root/.docker/config.json"
          SAVE=$(mktemp -d)

          echo "== $($SUDO pveversion); $(skopeo --version 2>&1)"
          $SUDO pveversion -v | grep -E 'storage|pve-manager' || true
          echo "== how this Proxmox runs skopeo"
          $SUDO grep -rn -B2 -A8 "skopeo" /usr/share/perl5/PVE/ 2>/dev/null | grep -v '^--$' | head -80

          # The control: wrong credentials for docker.io handed to skopeo
          # directly must be refused, or wrong credentials prove nothing below.
          CTL=$(mktemp); printf '{"auths":{"docker.io":{"auth":"%s"}}}\n' "$(printf 'nexcage-probe:wrong' | base64)" > "$CTL"
          echo "== control: skopeo inspect with wrong credentials (must fail)"
          skopeo inspect --authfile "$CTL" "docker://$IMG" >/dev/null 2>/tmp/ctl.err && echo "control: ACCEPTED -- this method cannot tell anything" || echo "control: refused: $(tail -1 /tmp/ctl.err | cut -c1-200)"
          echo "== control: skopeo inspect anonymously (must work)"
          skopeo inspect --authfile /dev/null "docker://$IMG" >/dev/null 2>/tmp/ctl.err && echo "control: anonymous works" || echo "control: anonymous FAILED: $(tail -1 /tmp/ctl.err | cut -c1-200)"
          echo "== pvedaemon's environment"
          $SUDO cat "/proc/$(pgrep -o pvedaemon)/environ" | tr '\0' '\n' \
            | grep -E '^(HOME|USER|XDG_[A-Z_]*|REGISTRY_AUTH_FILE)=' || echo "(none of HOME, USER, XDG_*, REGISTRY_AUTH_FILE)"

          tmpls() { $SUDO pvesm list local --content vztmpl 2>/dev/null | awk 'NR>1 {print $1}' | sort; }
          BEFORE=$(tmpls)
          free_new() {
            for v in $(comm -13 <(echo "$BEFORE") <(tmpls)); do $SUDO pvesm free "$v" >/dev/null 2>&1; done
          }
          restore() {
            for f in $CANDIDATES; do
              $SUDO rm -f "$f"
              b="$SAVE/$(echo "$f" | tr / _)"
              [ -f "$b" ] && $SUDO cp -p "$b" "$f"
            done
          }
          cleanup() {
            restore
            free_new
            $SUDO rm -rf "$SAVE"
          }
          trap cleanup EXIT

          # Whatever the node has is kept aside, and put back at the end.
          for f in $CANDIDATES; do
            if $SUDO test -f "$f"; then
              echo "(the node has $f; set aside for the probe)"
              $SUDO cp -p "$f" "$SAVE/$(echo "$f" | tr / _)"
              $SUDO rm -f "$f"
            fi
          done

          # skopeo itself, as root through sudo and with no --authfile: what
          # Proxmox's call would find if it passed nothing and kept HOME.
          via_skopeo() {
            $SUDO skopeo inspect "docker://$IMG" >/dev/null 2>/tmp/sk.err && echo "pulled" \
              || echo "FAILED: $(tail -1 /tmp/sk.err | cut -c1-200)"
          }
          # pvedaemon runs with no HOME, USER or XDG_* (printed above), and its
          # API was not reachable from the node itself in the first two runs.
          # The same skopeo, as root, with an environment as empty as that.
          via_noenv() {
            $SUDO env -i PATH=/usr/sbin:/usr/bin:/sbin:/bin skopeo inspect "docker://$IMG" >/dev/null 2>/tmp/ne.err && echo "pulled" \
              || echo "FAILED: $(tail -1 /tmp/ne.err | cut -c1-200)"
          }
          via_pvesh() {
            $SUDO pvesh create "/nodes/$NODE/storage/local/oci-registry-pull" --reference "$IMG" >/tmp/pv.out 2>/tmp/pv.err; rc=$?
            new=$(comm -13 <(echo "$BEFORE") <(tmpls) | tr '\n' ' ')
            free_new
            { echo "    | exit $rc; new on the storage: ${new:-nothing}"
              sed 's/^/    | stdout: /' /tmp/pv.out | cut -c1-220 | tail -4
              sed 's/^/    | stderr: /' /tmp/pv.err | cut -c1-220 | tail -4; } >&2
            [ -n "$new" ] && echo "pulled" || echo "FAILED (nothing on the storage)"
          }
          # Credentials docker.io will refuse: user nexcage-probe, password wrong.
          WRONG=$(printf 'nexcage-probe:wrong' | base64)
          put() { $SUDO mkdir -p "$(dirname "$1")"; printf '{"auths":{"docker.io":{"auth":"%s"},"https://index.docker.io/v1/":{"auth":"%s"}}}\n' "$WRONG" "$WRONG" | $SUDO tee "$1" >/dev/null; }

          echo
          echo "== no auth file anywhere (the baseline: all must pull)"
          echo "skopeo:    $(via_skopeo)"
          echo "pvesh:     $(via_pvesh)"
          echo "no env:    $(via_noenv)"
          for f in $CANDIDATES; do
            echo
            echo "== wrong credentials in $f only (FAILED means that path reads it)"
            put "$f"
            echo "skopeo:    $(via_skopeo)"
            echo "pvesh:     $(via_pvesh)"
            echo "no env:    $(via_noenv)"
            $SUDO rm -f "$f"
          done
