version: 2
updates:
  # GitHub Actions dependencies
  # Third-party actions are pinned by commit with the version in a comment;
  # Dependabot moves both.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    # A release has to be a week old before it is proposed: a compromised
    # release is usually found and pulled within days.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    reviewers:
      - "CageForge/nexcage-maintainers"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(ci)"
      include: "scope"
    groups:
      github-actions:
        patterns:
          - "actions/*"
          - "mlugg/*"
          - "anchore/*"
          - "cyclonedx/*"
          - "ossf/*"
          - "github/*"
          - "softprops/*"
          - "chef-cookbooks/*"
        update-types:
          - "minor"
          - "patch"

  # Docker dependencies (if Dockerfile exists)
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    reviewers:
      - "CageForge/nexcage-maintainers"
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "chore(docker)"
      include: "scope"

  # The hash-pinned Python tools CI installs: .github/requirements/*.txt
  # (the documentation site's, and zizmor).
  - package-ecosystem: "pip"
    directory: "/.github"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "chore(ci)"
      include: "scope"
    groups:
      python-tools:
        patterns:
          - "*"

  # Note: OCI specs, crun, and Proxmox VE are monitored via
  # .github/workflows/dependency_check.yml workflow
  # Dependabot doesn't support direct monitoring of:
  # - OCI Runtime/Image Specs (specifications, not packages)
  # - crun library (C library, typically via git submodule)
  # - Proxmox VE releases (external system, not a package)

