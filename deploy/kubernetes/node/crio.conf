# nexcage as a runtime of CRI-O. Put it at /etc/crio/crio.conf.d/10-nexcage.conf
# and restart CRI-O. runtime_root keeps nexcage's state apart from the default
# runtime's.
#
# There is no cgroup setting here because CRI-O has none per runtime: its
# [crio.runtime] cgroup_manager serves every handler, nexcage's as well as
# runc's, and has to match the kubelet's cgroupDriver. Its default, systemd,
# makes conmon pass --systemd-cgroup, so that systemd places the container
# under the pod's slice. Setting it from this file would change it for every
# other runtime on the node.
[crio.runtime.runtimes.nexcage]
runtime_path = "/usr/bin/nexcage"
runtime_type = "oci"
runtime_root = "/run/nexcage-crio"
