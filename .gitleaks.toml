# gitleaks configuration for nexcage: gitleaks' own rules, minus paths that
# are not this project's text. security.yml fails on any finding.
#
# This file used to add [[rules]] entries meant as ignores. A rule without an
# id is a detection rule, so every line naming zig-out/ was reported as a
# leak (61 in a run that stayed green behind `|| true`). Ignores are
# allowlists; a finding accepted on purpose goes in .gitleaksignore, its
# fingerprint with a comment saying why.
title = "nexcage"

[extend]
useDefault = true

[[allowlists]]
description = "Not this project's text: vendored code, build output"
paths = [
    '''^(?:\./)?deps(?:/|$)''',
    '''^(?:\./)?zig-out(?:/|$)''',
    '''^(?:\./)?\.zig-cache(?:/|$)''',
]
