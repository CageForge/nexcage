site_name: NexCage Docs
site_description: Command-line lifecycle for LXC containers on a Proxmox VE host
site_url: https://cageforge.github.io/nexcage/
repo_url: https://github.com/CageForge/nexcage
repo_name: CageForge/nexcage
copyright: "© 2025 CageForge"

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.expand
    - content.code.copy
    - content.action.edit
    - content.tabs.link
    - navigation.top
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo

nav:
  - Overview: index.md
  - Getting Started:
    - Install: INSTALL.md
    - Dev Quickstart: DEV_QUICKSTART.md
    - Development Workflow: DEVELOPMENT_WORKFLOW.md
  - CLI Reference: CLI_REFERENCE.md
  - Kubernetes Integration: KUBERNETES_INTEGRATION.md
  - Operations:
    - Debug Logging: DEBUG_LOGGING_GUIDE.md
    - Troubleshooting: TROUBLESHOOTING_GUIDE.md
    - Self-hosted Runner Security: SECURITY_SELF_HOSTED_RUNNER.md
  - Architecture:
    - Overview: architecture/OVERVIEW.md
    - Backends: architecture/BACKENDS.md
    - Modules: architecture/MODULES.md
    - Deployment: architecture/DEPLOYMENT.md
    - ADRs:
      - Runtime Selection: architecture/ADR-001-Container-Runtime-Selection.md
      - Memory Management: architecture/ADR-002-Memory-Management-Strategy.md
      - Security Architecture: architecture/ADR-003-Security-Architecture.md
      - Mermaid Architecture Docs: architecture/ADR-004-Mermaid-Architecture-Docs.md
      - ADR Template: architecture/ADR-000-Template.md
  - CI/CD: CI_CD_SETUP.md
  - Compliance: COMPLIANCE_CNCF_CHECKLIST.md
  - Releases:
    - v0.9.1: releases/NOTES_v0.9.1.md
    - v0.9.0: releases/NOTES_v0.9.0.md
    - v0.8.0 (MVP): releases/NOTES_v0.8.0.md
    - v0.7.5 (OCI Registry Pull): releases/NOTES_v0.7.5.md
    - v0.7.4 (OCI 1.3.0): releases/NOTES_v0.7.4.md
    - v0.7.3: releases/NOTES_v0.7.3.md
    - v0.7.2: releases/NOTES_v0.7.2.md

docs_dir: docs
plugins:
  - search
  - mike
extra:
  version:
    provider: mike
markdown_extensions:
  - admonition
  - codehilite
  - footnotes
  - meta
  - toc:
      permalink: true

