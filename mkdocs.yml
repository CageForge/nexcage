site_name: NexCage Docs
site_description: Next-generation container runtime for Proxmox VE using LXC and OCI backends
site_url: https://cageforge.github.io/nexcage/
repo_url: https://github.com/CageForge/nexcage
repo_name: CageForge/nexcage
copyright: "© 2025 CageForge"

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.expand
    - content.code.copy
    - content.action.edit
    - content.tabs.link
    - navigation.top
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo

nav:
  - Overview: index.md
  - Getting Started:
    - Install: INSTALL.md
    - Dev Quickstart: DEV_QUICKSTART.md
    - Development Workflow: DEVELOPMENT_WORKFLOW.md
    - Ubuntu Dev Setup: DEVELOPMENT_UBUNTU.md
  - User Guide: user_guide.md
  - CLI Reference:
    - Command Reference: CLI_REFERENCE.md
    - CLI Cookbook: CLI_COOKBOOK.md
  - Architecture:
    - Overview: architecture/OVERVIEW.md
    - System Context: diagrams/SYSTEM_CONTEXT.md
    - ADRs:
      - Runtime Selection: architecture/ADR-001-Container-Runtime-Selection.md
      - Memory Management: architecture/ADR-002-Memory-Management-Strategy.md
      - Security Architecture: architecture/ADR-003-Security-Architecture.md
  - Integration:
    - containerd Integration: integration/CONTAINERD_INTEGRATION.md
    - Monitoring & Observability: integration/MONITORING.md
  - Operations:
    - Migration Guide: MIGRATION_GUIDE.md
    - Performance Tuning: PERFORMANCE_TUNING.md
  - CI/CD: CI_CD_SETUP.md
  - Dependencies: DEPENDENCIES.md
  - Proxmox Testing: proxmox/PROXMOX_TESTING.md
  - Releases:
    - v0.7.5 (OCI Registry Pull): releases/NOTES_v0.7.5.md
    - v0.7.4 (OCI 1.3.0): releases/NOTES_v0.7.4.md
    - v0.7.3: releases/NOTES_v0.7.3.md
    - v0.7.2: releases/NOTES_v0.7.2.md

docs_dir: docs
plugins:
  - search
  - mike
extra:
  version:
    provider: mike
markdown_extensions:
  - admonition
  - codehilite
  - footnotes
  - meta
  - toc:
      permalink: true

